name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # До этапа 6 публикуем стартовую страницу, прототип и проверки этапа 0.
      # На этапе 6 сюда добавится сборка приложения (npm ci && npm run build → _site).
      - name: Собрать сайт
        run: |
          mkdir -p _site/prototype _site/spikes
          cp site/index.html _site/index.html
          cp prototype/index.html _site/prototype/index.html
          cp -r spikes/. _site/spikes/
          rm -f _site/spikes/RESULTS.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
