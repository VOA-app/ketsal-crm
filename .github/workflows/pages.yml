name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Проверки
        run: |
          npm ci
          npm run lint
          npm test

      # Рабочее приложение — в корне сайта (SPEC §11). /app/ — та же рабочая сборка для значков
      # «Домой», установленных до этапа 6. /demo/ — с выдуманными данными, своей базой на устройстве
      # и облаком в памяти: к настоящему Диску демо не подключается.
      - name: Рабочее приложение
        env:
          BASE: /ketsal-crm/
        run: |
          npm run build
          mkdir -p _site
          cp -r dist/. _site/

      - name: Рабочее приложение по старому адресу /app/
        env:
          BASE: /ketsal-crm/app/
        run: |
          npm run build
          cp -r dist _site/app

      - name: Демо
        env:
          BASE: /ketsal-crm/demo/
          VITE_DEMO: '1'
        run: |
          npm run build
          cp -r dist _site/demo

      - name: Прототип и проверки этапа 0
        run: |
          mkdir -p _site/prototype _site/spikes
          cp prototype/index.html _site/prototype/index.html
          cp -r spikes/. _site/spikes/
          rm -f _site/spikes/RESULTS.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
