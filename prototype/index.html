/* Кетсаль — учёт клиентов. Цвета и шрифты по брендбуку (BRAND.md §1–2).
   Изумруд — акценты и кнопки (не больше четверти экрана), алый — только точки-маркеры и одна цифра на значке. */

:root {
  --emerald: #217870; --deep: #14514B; --light-emerald: #5FA49D; --mint: #E7F0EE;
  --graphite: #2B2223; --milk: #F7F4F0; --gray: #6E7674; --line: #DFE4E2; --scarlet: #D00405;

  --bg: #F7F4F0;
  --surface: #FFFFFF;
  --surface-2: #E7F0EE;
  --text: #2B2223;
  --text-2: #6E7674;
  --line-c: #DFE4E2;
  --accent: #217870;
  --accent-press: #14514B;
  --accent-text: #217870;
  --accent-soft: #E7F0EE;
  --accent-ink: #14514B;
  --on-accent: #FFFFFF;
  --alert: #D00405;
  --danger-text: #B80304;
  --seg-bg: #ECE8E2;
  --bar: #217870;
  --bar-muted: #C9D5D2;
  --grid: #E6EAE8;
  --backdrop: rgba(43, 34, 35, .42);
  --shadow-2: 0 12px 36px rgba(43, 34, 35, .14);
  --toast-bg: #2B2223;
  --toast-fg: #FFFFFF;
  --stage-bg: #F7F4F0;
  --logo-word: #2B2223;
  --logo-bird: #217870;
  --bird-sil: rgba(33, 120, 112, .12);
  --focus: rgba(33, 120, 112, .22);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #1C1617; --surface: #272021; --surface-2: #1D2F2D; --text: #F3EFEA; --text-2: #A7AEAC; --line-c: #3A3233;
  --accent: #217870; --accent-press: #1A655E; --accent-text: #6FB5AD; --accent-soft: #1D2F2D; --accent-ink: #9CD1CA;
  --on-accent: #FFFFFF; --alert: #E2302F; --danger-text: #F08A87; --seg-bg: #151011; --bar: #4FA39A; --bar-muted: #3E4A48; --grid: #332B2C;
  --backdrop: rgba(0, 0, 0, .58); --shadow-2: 0 12px 36px rgba(0, 0, 0, .45); --toast-bg: #F3EFEA; --toast-fg: #2B2223;
  --stage-bg: #141011; --logo-word: #FFFFFF; --logo-bird: #FFFFFF; --bird-sil: rgba(255, 255, 255, .07); --focus: rgba(111, 181, 173, .3);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1617; --surface: #272021; --surface-2: #1D2F2D; --text: #F3EFEA; --text-2: #A7AEAC; --line-c: #3A3233;
    --accent: #217870; --accent-press: #1A655E; --accent-text: #6FB5AD; --accent-soft: #1D2F2D; --accent-ink: #9CD1CA;
    --on-accent: #FFFFFF; --alert: #E2302F; --danger-text: #F08A87; --seg-bg: #151011; --bar: #4FA39A; --bar-muted: #3E4A48; --grid: #332B2C;
    --backdrop: rgba(0, 0, 0, .58); --shadow-2: 0 12px 36px rgba(0, 0, 0, .45); --toast-bg: #F3EFEA; --toast-fg: #2B2223;
    --stage-bg: #141011; --logo-word: #FFFFFF; --logo-bird: #FFFFFF; --bird-sil: rgba(255, 255, 255, .07); --focus: rgba(111, 181, 173, .3);
    color-scheme: dark;
  }
}

  background-size: 600px 600px;
  color: var(--text);
  font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
:root[data-theme="dark"] body { background-image: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background-image: none; } }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; margin: 0; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.display { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; letter-spacing: .005em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i-sm { width: 18px; height: 18px; }
.i-lg { width: 28px; height: 28px; }

/* ── Сцена: «телефон» по центру, справа — сценарии для проверки ── */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 24px; }
.device {
  --safe-top: 14px; --safe-bottom: 8px;
  width: 390px; height: min(844px, calc(100vh - 48px)); height: min(844px, calc(100dvh - 48px));
  border-radius: 44px; overflow: hidden; position: relative; flex: none; background: var(--bg);
  box-shadow: var(--shadow-2), 0 0 0 1px rgba(43, 34, 35, .08), 0 0 0 10px var(--surface), 0 0 0 11px rgba(43, 34, 35, .1);
}
#app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
/* Внутри «телефона» полосы прокрутки не рисуем, как на iPhone */
#app .scroller, #app .sheet-scroll, #app .onb-body, #lock, .guide-list { scrollbar-width: none; }
#app .scroller::-webkit-scrollbar, #app .sheet-scroll::-webkit-scrollbar, #app .onb-body::-webkit-scrollbar, #lock::-webkit-scrollbar { display: none; }
.guide-list { scrollbar-width: thin; }
.guide-panel {
  width: 390px; height: min(844px, calc(100vh - 48px)); height: min(844px, calc(100dvh - 48px));
  flex: none; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-2);
  display: flex; flex-direction: column; overflow: hidden;
}
@media (max-width: 999px) { .guide-panel { display: none; } }
@media (max-width: 520px), (max-height: 560px) {
  .stage { padding: 0; }
  .device { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  body { background: var(--bg); }
}

/* ── Экран и навигация ── */
#screen { flex: 1; position: relative; min-height: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.topbar { flex: none; padding: calc(var(--safe-top) + 4px) 16px 8px; background: var(--bg); position: relative; z-index: 2; }
.topbar--nav { padding-bottom: 4px; border-bottom: 1px solid transparent; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.topbar-actions { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.title-lg { font-size: 38px; line-height: 1.05; margin: 2px 0 10px; }
.nav-row { display: grid; grid-template-columns: minmax(96px, 1fr) auto minmax(96px, 1fr); align-items: center; min-height: 44px; margin: 0 -8px; }
.nav-row > :last-child { justify-self: end; }
.nav-title { text-align: center; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.back-btn { display: inline-flex; align-items: center; gap: 0; color: var(--accent-text); font-weight: 500; height: 44px; padding: 0 8px 0 2px; justify-self: start; }
.back-btn .i { width: 26px; height: 26px; }
.scroller { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 110px; -webkit-overflow-scrolling: touch; }
.scroller--bar { padding-bottom: 150px; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; color: var(--text); flex: none; position: relative; }
.icon-btn:active { background: var(--accent-soft); }
.icon-btn--accent { color: var(--accent-text); }

#tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line-c); padding: 4px 4px calc(4px + var(--safe-bottom)); position: relative; z-index: 3; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; color: var(--text-2); font-size: 11px; font-weight: 500; position: relative; }
.tab .i { width: 24px; height: 24px; }
.tab.on { color: var(--accent-text); }
.badge { position: absolute; top: 3px; left: calc(50% + 5px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--alert); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; line-height: 1; }

.fab { position: absolute; right: 16px; bottom: 16px; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(20, 81, 75, .32); z-index: 5; }
.fab .i { width: 28px; height: 28px; stroke-width: 2; }
.fab:active { background: var(--accent-press); }
.bottom-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 12px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }

/* ── Поиск, чипы, сегменты ── */
.search { display: flex; align-items: center; gap: 8px; height: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-c); padding: 0 6px 0 12px; color: var(--text-2); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; color: var(--text); min-width: 0; height: 100%; padding: 0; }
.search input::placeholder { color: var(--text-2); }
.search input::-webkit-search-cancel-button { display: none; }
.search-clear { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--text-2); }
.search input:placeholder-shown + .search-clear { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips--scroll { flex-wrap: nowrap; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 2px; scrollbar-width: none; position: relative; }
.chips--scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 14px; border-radius: 18px; border: 1px solid var(--line-c); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; line-height: 1.2; }
.chip .n { color: var(--text-2); font-weight: 600; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.on .n { color: inherit; opacity: .8; }
.chip:disabled { opacity: .38; cursor: default; }
.chip--wrap { white-space: normal; text-align: left; }
.chip .swatch { width: 14px; height: 14px; }

.seg { display: flex; background: var(--seg-bg); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 36px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--text-2); text-align: center; padding: 0 8px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(43, 34, 35, .14); }
.seg--scroll { overflow-x: auto; scrollbar-width: none; position: relative; }
.seg--scroll::-webkit-scrollbar { display: none; }
.seg--scroll button { flex: none; padding: 0 12px; }
.seg--sm button { min-height: 32px; }

/* ── Строки списков ── */
.list { background: var(--surface); border-radius: 16px; border: 1px solid var(--line-c); overflow: hidden; }
.list + .list { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; width: 100%; text-align: left; position: relative; }
.list > .row + .row::before, .list > .row-wrap + .row-wrap::before { content: ''; position: absolute; top: 0; left: 70px; right: 0; height: 1px; background: var(--line-c); }
.list--plain > .row + .row::before { left: 14px; }
.row-wrap { display: flex; align-items: center; position: relative; }
.row-wrap > .row { flex: 1; min-width: 0; }
.row-wrap > .row-act { flex: none; margin-right: 12px; }
button.row:active, .row-link:active { background: var(--accent-soft); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.row-sub2 { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.row-chev { color: var(--text-2); }
.row--dim .row-title, .row--dim .row-side { opacity: .55; }
.list-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 4px 8px; font-size: 13px; color: var(--text-2); }
.sort-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-text); font-weight: 500; font-size: 13px; min-height: 32px; }
.sort-btn .i { width: 16px; height: 16px; }

.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 15px; flex: none; overflow: hidden; letter-spacing: .02em; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--xl { width: 84px; height: 84px; font-size: 26px; font-weight: 500; }
.avatar--sm { width: 36px; height: 36px; font-size: 13px; }

.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 10px; border-radius: 12px; background: var(--surface-2); font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; }
.pill--line { background: transparent; border: 1px solid var(--line-c); color: var(--text-2); }
.pill--solid { background: var(--accent); color: var(--on-accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-text); flex: none; display: inline-block; }
.dot--alert { background: var(--alert); }
.dot--muted { background: var(--text-2); opacity: .6; }
.dot--ink { background: var(--text); }
.tag { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 13px; border: 1px solid var(--line-c); font-size: 13px; color: var(--text-2); }
.swatch { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block; box-shadow: inset 0 0 0 1px rgba(43, 34, 35, .15); }

/* ── Карточки и блоки ── */
.card { background: var(--surface); border: 1px solid var(--line-c); border-radius: 16px; padding: 14px 16px; }
.card + .card { margin-top: 12px; }
.card--mint { background: var(--surface-2); border-color: transparent; }
.section-title { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 20px; }
.section-title:first-child { margin-top: 8px; }
.section-title .btn-link { font-size: 13px; }
.btn-link { color: var(--accent-text); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-c); font-size: 15px; }
.kv:last-child { border-bottom: 0; padding-bottom: 2px; }
.kv:first-child { padding-top: 2px; }
.kv .k { color: var(--text-2); flex: none; }
.kv .v { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv--total .v { font-weight: 600; font-size: 17px; }
.empty { text-align: center; padding: 48px 24px; color: var(--text-2); }
.empty .display { font-size: 28px; color: var(--text); margin-bottom: 8px; }
.empty p { font-size: 15px; margin-bottom: 18px; }
.note { font-size: 13px; color: var(--text-2); margin-top: 8px; line-height: 1.45; }

.banner { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 10px 8px 10px 14px; margin: 6px 0 4px; font-size: 14px; }
.banner > span { flex: 1; }

/* ── Кнопки ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 500; font-size: 16px; white-space: nowrap; text-align: center; }
.btn .i { width: 20px; height: 20px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:active { background: var(--accent-press); }
.btn-secondary { background: var(--accent-soft); color: var(--accent-ink); }
.btn-ghost { color: var(--accent-text); }
.btn-outline { border: 1px solid var(--line-c); background: var(--surface); color: var(--text); }
.btn-danger { color: var(--danger-text); border: 1px solid var(--line-c); background: var(--surface); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 10px; }
.btn-row > .btn { flex: 1; }
.btn-stack { display: grid; gap: 10px; }

/* ── Карта клиента ── */
.profile { text-align: center; padding: 6px 0 4px; }
.profile .avatar { margin: 0 auto 10px; }
.profile-name { font-size: 32px; line-height: 1.1; font-weight: 400; }
.profile-meta { color: var(--text-2); font-size: 14px; margin-top: 6px; }
.profile-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
.quick { display: flex; justify-content: center; gap: 10px; margin: 16px 0 6px; }
.quick button { width: 88px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--accent-text); padding: 10px 0 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-c); }
.quick button:active { background: var(--accent-soft); }
.alerts { display: grid; gap: 10px; margin-top: 14px; }
.rem { background: var(--surface); border: 1px solid var(--line-c); border-radius: 16px; padding: 12px 14px; }
.rem--accent { background: var(--surface-2); border-color: transparent; }
.rem-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.rem-head .rem-state { margin-left: auto; font-weight: 500; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.rem-sub { font-size: 13px; color: var(--text-2); margin: 4px 0 0 16px; }
.rem-note { font-size: 13px; color: var(--text-2); margin: 2px 0 0 16px; }
.rem-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.rem-actions .btn { flex: 1 1 auto; }
.notice { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line-c); border-radius: 14px; padding: 8px 8px 8px 14px; font-size: 14px; }
.notice > span { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line-c); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat-v { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-l { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.seg--card { margin: 6px 0 12px; }

.proc-item { display: flex; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; position: relative; align-items: flex-start; }
.list > .proc-item + .proc-item::before { content: ''; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--line-c); }
.proc-item:active { background: var(--accent-soft); }
.proc-main { flex: 1; min-width: 0; }
.proc-title { font-weight: 500; }
.proc-meta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.proc-mat { font-size: 13px; color: var(--text); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.proc-mat span { display: inline-flex; align-items: center; gap: 5px; }
.proc-mat .swatch { width: 12px; height: 12px; }
.proc-sum { flex: none; text-align: right; font-weight: 500; white-space: nowrap; }
.proc-sum small { display: block; font-weight: 400; font-size: 12px; color: var(--text-2); }
.proc-item--dim .proc-title, .proc-item--dim .proc-sum { opacity: .55; }

/* ── Фото ── */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.ph { display: block; width: 100%; text-align: left; position: relative; }
.ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; display: block; background: var(--surface-2); }
.ph-cap { font-size: 12px; color: var(--text-2); margin-top: 4px; line-height: 1.3; }
.ph-cap b { color: var(--text); font-weight: 500; }
.ph.sel img { outline: 3px solid var(--accent); outline-offset: 2px; }
.ph .ph-check { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: none; place-items: center; }
.ph.sel .ph-check { display: grid; }
.photo-strip { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 76px; height: 76px; border-radius: 10px; position: relative; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
.thumb-del { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; background: var(--graphite); color: #fff; display: grid; place-items: center; border: 2px solid var(--bg); }
.thumb-del .i { width: 14px; height: 14px; stroke-width: 2.4; }
.photo-add { width: 76px; height: 76px; border-radius: 10px; border: 1.5px dashed var(--light-emerald); color: var(--accent-text); display: grid; place-items: center; flex: none; background: var(--surface); }
.photo-stage + .photo-stage { margin-top: 14px; }
.photo-stage-label { font-size: 13px; color: var(--text-2); margin-bottom: 6px; display: flex; justify-content: space-between; }
.timeline-group + .timeline-group { margin-top: 16px; }
.timeline-head { font-size: 13px; color: var(--text-2); margin: 0 2px 8px; }
.timeline-head b { color: var(--text); font-weight: 500; }

/* ── Формы ── */
.form-card { background: var(--surface); border: 1px solid var(--line-c); border-radius: 16px; padding: 14px 14px 2px; }
.form-card + .form-card, .form-card + .warn-box, .warn-box + .form-card { margin-top: 12px; }
.form-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 20px 4px 8px; display: flex; justify-content: space-between; align-items: center; }
.form-title:first-child { margin-top: 2px; }
.field { display: block; margin-bottom: 14px; min-width: 0; }
.field-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0 2px 6px; }
.field-label .opt { font-weight: 400; }
.input, .select, .textarea { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line-c); background: var(--surface); padding: 0 14px; font-size: 16px; color: var(--text); outline: none; -webkit-appearance: none; appearance: none; }
.form-card .input, .form-card .select, .form-card .textarea { background: var(--bg); }
.input::placeholder, .textarea::placeholder { color: var(--text-2); opacity: .8; }
.textarea { min-height: 84px; padding: 12px 14px; resize: vertical; line-height: 1.45; display: block; }
.input[type="date"] { line-height: 46px; text-align: left; }
.input[type="date"]::-webkit-date-and-time-value { text-align: left; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
.field.err .input, .field.err .select, .field.err .chips { border-color: var(--alert); }
.field-err { font-size: 13px; color: var(--danger-text); margin: 6px 2px 0; display: flex; gap: 6px; align-items: center; }
.select-wrap { position: relative; }
.select-wrap::after { content: ''; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; border-right: 1.75px solid var(--text-2); border-bottom: 1.75px solid var(--text-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.select { padding-right: 38px; text-overflow: ellipsis; }
.affix { position: relative; }
.affix .input { padding-right: 38px; }
.affix > span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-2b { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
.hint { font-size: 13px; color: var(--text-2); margin: -6px 2px 14px; line-height: 1.45; }
.field .chips { margin-top: 2px; }
.field .chip { min-height: 40px; }
.inline-actions { display: flex; gap: 8px; align-items: center; }
.inline-actions .input { flex: 1; }

.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line-c); position: relative; flex: none; transition: background .2s; cursor: pointer; margin: 0; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin-bottom: 8px; }
.switch-row .t { font-weight: 500; }
.switch-row .s { font-size: 13px; color: var(--text-2); margin-top: 2px; }

.check { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-c); cursor: pointer; font-size: 15px; }
.check:last-child { border-bottom: 0; }
.check input { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--text-2); flex: none; margin: 0; display: grid; place-items: center; background: var(--surface); cursor: pointer; }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }

.warn-box { border-radius: 16px; background: var(--surface); border: 1px solid var(--line-c); padding: 6px 14px; }
.warn { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 14px; }
.warn + .warn { border-top: 1px solid var(--line-c); }
.warn .dot { margin-top: 6px; }
.warn > div { flex: 1; }
.warn--danger { font-weight: 600; }
.warn .btn-link { min-height: 24px; margin-top: 2px; font-weight: 500; }

.pg-row { border: 1px solid var(--line-c); border-radius: 14px; padding: 10px; margin-bottom: 10px; background: var(--bg); }
.pg-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.pg-top .select-wrap { flex: 1; min-width: 0; }
.pg-top .swatch { width: 22px; height: 22px; }
.pg-bottom { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
.pg-row .input, .pg-row .select { background: var(--surface); min-height: 44px; }
.total-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; margin: 4px 0 14px; }
.total-box .l { font-weight: 500; }
.total-box .s { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.total-box .v { font-size: 26px; font-weight: 600; white-space: nowrap; }
.discount-row { display: grid; grid-template-columns: 104px 1fr; gap: 8px; }
.discount-row .seg { height: 48px; }
.discount-row .seg button { min-height: 42px; font-size: 16px; }
.quick-fill { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 4px; padding: 0 16px 4px; scrollbar-width: none; }
.quick-fill::-webkit-scrollbar { display: none; }
.quick-fill .chip { background: var(--surface-2); border-color: transparent; }
.quick-fill .chip.on { background: var(--accent); color: var(--on-accent); }
.dup { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: -4px 0 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.dup > span { flex: 1; }

/* ── Шторки, диалоги, тост ── */
#overlays { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.sheet-layer { position: absolute; inset: 0; pointer-events: auto; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .22s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--safe-top) + 8px); background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; transform: translateY(102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); overflow: hidden; box-shadow: 0 -8px 30px rgba(0, 0, 0, .12); }
.sheet--auto { top: auto; max-height: calc(100% - var(--safe-top) - 40px); }
.sheet-layer.open .sheet-backdrop { opacity: 1; }
.sheet-layer.open .sheet { transform: none; }
.sheet-head { flex: none; display: grid; grid-template-columns: minmax(84px, 1fr) auto minmax(84px, 1fr); align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line-c); min-height: 56px; }
.sheet-head > :last-child { justify-self: end; }
.sheet-head h2 { font-size: 16px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.sheet-head .btn-ghost { min-height: 44px; padding: 0 10px; }

const NBSP = ' ';
function fmtNum(n) {
  const v = Math.round(Math.abs(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (n < 0 ? '−' : '') + v;
}
const fmtMoney = (n) => `${fmtNum(n)}${NBSP}₽`;
function fmtMoneyShort(n) {
  if (Math.abs(n) >= 1e6) return `${(n / 1e6).toFixed(1).replace('.', ',').replace(',0', '')}${NBSP}млн`;
  if (Math.abs(n) >= 1e3) return `${Math.round(n / 1e3)}${NBSP}тыс`;
  return fmtNum(n);
}
const parseMoney = (v) => {
  const n = parseInt(String(v ?? '').replace(/[^\d]/g, ''), 10);
  return Number.isFinite(n) ? n : 0;
};

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
const pl = (n, one, few, many) => `${n}${NBSP}${plural(n, one, few, many)}`;

// ── Даты хранятся строками YYYY-MM-DD ──
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_NOM = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_AXIS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const todayISO = () => toISO(new Date());
function parseISO(s) {
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
const isISO = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
function addDays(iso, n) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return toISO(d);
}
function addMonths(iso, n) {
  const d = parseISO(iso);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return toISO(d);
}
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
function monthsBetween(a, b) {
  const A = parseISO(a);
  const B = parseISO(b);
  let m = (B.getFullYear() - A.getFullYear()) * 12 + (B.getMonth() - A.getMonth());
  if (B.getDate() < A.getDate()) m -= 1;
  return m;
}
const startOfMonth = (iso) => `${iso.slice(0, 7)}-01`;
function endOfMonth(iso) {
  const d = parseISO(iso);
  return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
}
function fmtDate(iso, withYear = 'auto') {
  if (!isISO(iso)) return '';
  const d = parseISO(iso);
  const showYear = withYear === true || (withYear === 'auto' && d.getFullYear() !== new Date().getFullYear());
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${showYear ? ` ${d.getFullYear()}` : ''}`;
}
function fmtDateShort(iso) {
  if (!isISO(iso)) return '';
  const d = parseISO(iso);
  const y = d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '';
  return `${d.getDate()}${NBSP}${MONTHS_SHORT[d.getMonth()]}${y}`;
}
function fmtDateNum(iso) {
  if (!isISO(iso)) return '';
  const d = parseISO(iso);
  return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
}
function fmtMonthNum(iso) {
  if (!isISO(iso)) return '';
  const d = parseISO(iso);
  return `${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
}
const fmtMonthYear = (iso) => `${cap(MONTHS_NOM[parseISO(iso).getMonth()])} ${parseISO(iso).getFullYear()}`;
function relDay(iso) {
  const n = daysBetween(todayISO(), iso);
  if (n === 0) return 'сегодня';
  if (n === 1) return 'завтра';
  if (n === -1) return 'вчера';
  if (n > 1) return `через ${pl(n, 'день', 'дня', 'дней')}`;
  return `${pl(-n, 'день', 'дня', 'дней')} назад`;
}
function dayHeader(iso) {
  const n = daysBetween(iso, todayISO());
  const base = fmtDate(iso);
  if (n === 0) return `Сегодня, ${base}`;
  if (n === 1) return `Вчера, ${base}`;
  return `${cap(base)}, ${WEEKDAYS[parseISO(iso).getDay()]}`;
}
function ageOn(birthISO, onISO = todayISO()) {
  return Math.floor(monthsBetween(birthISO, onISO) / 12);
}

// ── Телефоны: храним +7XXXXXXXXXX ──
function normPhone(s) {
  let d = String(s || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '8') d = `7${d.slice(1)}`;
  if (d.length === 10 && d[0] === '9') d = `7${d}`;
  return d ? `+${d}` : '';
}
function fmtPhone(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '7') return `+7${NBSP}${d.slice(1, 4)}${NBSP}${d.slice(4, 7)}-${d.slice(7, 9)}-${d.slice(9)}`;
  return p || '';
}
function phoneQueryDigits(q) {
  let d = String(q || '').replace(/\D/g, '');
  if (d.length >= 4 && d[0] === '8') d = `7${d.slice(1)}`;
  return d;
}

// Детерминированный генератор для демо-данных
function mulberry32(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function download(name, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
}

// Демо-покупки расходников за последний год
function demoExpenses(T) {
  const rnd = mulberry32(7700);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const out = [];
  const add = (daysAgo, category, name, amount) => out.push({ id: `ex_${out.length + 1}`, category, name, amount, date: addDays(T, -daysAgo) });
  const pigments = ['Марка А · Тёплый шоколад', 'Марка В · Нюд розовый', 'Марка Б · Карамель', 'Марка Г · Камуфляж, светлый беж'];
  for (let m = 0; m < 12; m += 1) {
    const base = m * 30;
    add(base + ri(0, 9), 'Иглы', 'Картриджи 1RL 0,30 мм, 20 шт', ri(18, 26) * 100);
    add(base + ri(4, 20), 'Одноразовые материалы', 'Перчатки, салфетки, плёнка', ri(9, 16) * 100);
    if (m % 2 === 0) add(base + ri(3, 25), 'Анестезия', 'Крем лидокаин + прилокаин', ri(14, 22) * 100);
    if (m % 3 === 0) add(base + ri(2, 28), 'Пигменты', pigments[(m / 3) % pigments.length], ri(35, 60) * 100);
  }
  return out;
}

const demoPhotoCache = new Map();
function demoPhoto(id) {
  if (demoPhotoCache.has(id)) return demoPhotoCache.get(id);
  const [, kind, stage, v] = id.split(':');
  const uri = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(demoPhotoSVG(kind, stage, Number(v) || 0))}`;
  demoPhotoCache.set(id, uri);
  return uri;
}

function qPoint(p0, p1, p2, t) {
  const u = 1 - t;
  return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
}

function demoPhotoSVG(kind, stage, v) {
  const skins = [['#F4E5D9', '#E3C9B6'], ['#F0DDCC', '#DDC0AA'], ['#F6E8DD', '#E6CEBC'], ['#EBD6C5', '#D6B9A3']];
  const [c1, c2] = skins[v % skins.length];
  const k = stage === 'before' ? 0 : stage === 'after' ? 2 : 1; // 0 — до, 1 — через месяц, 2 — сразу после
  let body = '';
  if (kind === 'brows') {
    const col = ['#4E3A30', '#5B4739', '#3F3B39', '#6B4C38'][v % 4];
    const op = [0.24, 0.64, 0.94][k];
    let hairs = '';
    if (k === 0) {
      for (let i = 0; i < 9; i += 1) {
        const x = 236 + i * 13;
        hairs += `<path d="M${x} ${147 - i * 3.3}l9 -7" stroke="${col}" stroke-opacity=".34" stroke-width="1.6" stroke-linecap="round"/>`;
      }
    }
    const brow = `<path d="M222 150C250 120 300 104 346 111C354 112 360 116 362 121C330 118 290 125 252 143C240 148 230 152 222 150Z" fill="${col}" fill-opacity="${op}"/>`;
    const P0 = [236, 198], P1 = [292, 176], P2 = [350, 196];
    let lashes = '';
    for (let t = 0.12; t < 0.9; t += 0.11) {
      const [x, y] = qPoint(P0, P1, P2, t);
      lashes += `<path d="M${x.toFixed(1)} ${y.toFixed(1)}l${(-3 + t * 7).toFixed(1)} 10" stroke="#4A3D38" stroke-width="1.6" stroke-linecap="round"/>`;
    }
    const eye = `<path d="M236 198Q292 176 350 196" stroke="#6A5750" stroke-width="3" fill="none" stroke-linecap="round"/>${lashes}`;
    body = `<g>${brow}${hairs}${eye}</g><g transform="translate(400 0) scale(-1 1)">${brow}${hairs}${eye}</g>`;
  } else if (kind === 'lips') {
    const sets = [['#D3A39B', '#C56E72', '#B4434F'], ['#D6A69A', '#CF7C6E', '#CB5A4E'], ['#CFA19A', '#B8707A', '#9E3342'], ['#D8AAA0', '#C98B85', '#B96F6B']];
    const col = sets[v % 4][k];
    const op = [0.62, 0.86, 0.96][k];
    const upper = 'M110 152C140 128 172 118 190 130C196 134 204 134 210 130C228 118 260 128 290 152C250 158 150 158 110 152Z';
    const lower = 'M110 152C150 160 250 160 290 152C268 192 232 206 200 206C168 206 132 192 110 152Z';
    body = `<path d="${upper}" fill="${col}" fill-opacity="${op}"/><path d="${lower}" fill="${col}" fill-opacity="${op}"/>`
      + `<path d="M112 152C150 160 250 160 288 152" stroke="#7E4144" stroke-opacity=".45" stroke-width="2" fill="none"/>`
      + (k === 0 ? `<path d="${upper}" fill="none" stroke="#B0847B" stroke-opacity=".35"/>` : '')
      + (k > 0 ? '<ellipse cx="200" cy="182" rx="34" ry="6" fill="#fff" fill-opacity=".16"/>' : '');
  } else if (kind === 'lash') {
    const lid = 'M92 160Q200 84 308 160';
    const col = ['#7A6A62', '#2E2828', '#1E1A1A'][k];
    const w = [1.5, 3.6, 5.2][k];
    let lashes = '';
    for (let t = 0.12; t < 0.92; t += 0.08) {
      const [x, y] = qPoint([92, 160], [200, 84], [308, 160], t);
      const dx = (t - 0.5) * 22;
      lashes += `<path d="M${x.toFixed(1)} ${y.toFixed(1)}q${(dx * 0.4).toFixed(1)} -12 ${dx.toFixed(1)} -20" stroke="#2B2425" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
    }
    body = '<defs><clipPath id="eye"><path d="M92 160Q200 84 308 160Q200 222 92 160Z"/></clipPath></defs>'
      + '<path d="M92 160Q200 84 308 160Q200 222 92 160Z" fill="#FAF6F2" stroke="#7C6A61" stroke-width="1.5"/>'
      + '<g clip-path="url(#eye)"><circle cx="200" cy="154" r="37" fill="#6D5A4B"/><circle cx="200" cy="154" r="15" fill="#221B1A"/><circle cx="188" cy="143" r="6" fill="#fff" fill-opacity=".7"/></g>'
      + `${lashes}<path d="${lid}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  } else if (kind === 'camo') {
    const scar = 'M118 214C170 178 232 160 292 106';
    if (k === 0) {
      body = `<path d="${scar}" stroke="#D5A99D" stroke-opacity=".7" stroke-width="22" fill="none" stroke-linecap="round"/><path d="${scar}" stroke="#F7E4DE" stroke-width="15" fill="none" stroke-linecap="round"/>`;
      for (let i = 0; i < 7; i += 1) {
        const [x, y] = qPoint([118, 214], [205, 175], [292, 106], 0.1 + i * 0.13);
        body += `<path d="M${(x - 9).toFixed(1)} ${(y - 9).toFixed(1)}l18 18" stroke="#D9AEA2" stroke-width="2" stroke-opacity=".6"/>`;
      }
    } else {
      const col = k === 2 ? '#E0C3AF' : '#EACFBF';
      body = `<path d="${scar}" stroke="#D8B6A2" stroke-opacity="${k === 2 ? 0.12 : 0.22}" stroke-width="20" fill="none" stroke-linecap="round"/><path d="${scar}" stroke="${col}" stroke-opacity=".9" stroke-width="14" fill="none" stroke-linecap="round"/>`;
    }
  } else if (kind === 'areola') {
    const col = ['#E2C4B6', '#CD998C', '#C4887B'][k];
    body = `<ellipse cx="200" cy="150" rx="${k === 0 ? 58 : 64}" ry="${k === 0 ? 52 : 64}" fill="${col}"/><circle cx="200" cy="150" r="17" fill="${col}" style="filter:brightness(.9)"/><circle cx="200" cy="150" r="17" fill="#8A5A50" fill-opacity=".18"/>`;
  } else if (kind === 'scalp') {
    const r = mulberry32(99 + v);
    const n = [70, 260, 320][k];
    const op = [0.35, 0.7, 0.85][k];
    let dots = '';
    for (let i = 0; i < n; i += 1) {
      const a = r() * Math.PI * 2;
      const d = Math.sqrt(r());
      dots += `<circle cx="${(200 + Math.cos(a) * d * 150).toFixed(1)}" cy="${(150 + Math.sin(a) * d * 110).toFixed(1)}" r="1.5"/>`;
    }
    body = `<g fill="#3E3A3A" fill-opacity="${op}">${dots}</g>`;
  } else if (kind === 'doc') {

  const LAST = ['Абрамова', 'Баранова', 'Белоусова', 'Виноградова', 'Гусева', 'Давыдова', 'Ершова', 'Жукова', 'Зуева', 'Ильина', 'Калинина', 'Киселёва', 'Королёва', 'Кудрявцева', 'Лаптева', 'Макарова', 'Максимова', 'Мельникова', 'Назарова', 'Осипова', 'Панова', 'Полякова', 'Романова', 'Савельева', 'Сафонова', 'Семёнова', 'Степанова', 'Титова', 'Устинова', 'Филиппова', 'Фролова', 'Хохлова', 'Чернова', 'Шарова', 'Щербакова', 'Яковлева', 'Горбунова', 'Тихонова', 'Воробьёва', 'Комиссарова'];
  const PREF = ['917', '927', '937', '960', '906', '953', '902'];
  const SOURCES = ['ВК', 'ВК', 'ВК', 'MAX', '2ГИС', 'Яндекс Карты', 'Рекомендация', 'Рекомендация', 'Проходила мимо'];
  const KINDS = ['vk', 'vk', 'vk', 'max', 'tg', 'wa', 'phone'];
  const PAY = ['card', 'card', 'card', 'transfer', 'transfer', 'cash'];
  const ZONEW = ['brows', 'brows', 'brows', 'brows', 'lips', 'lips', 'lips', 'lash', 'undereye', 'scars'];
  const used = new Set(S0.clients.map((c) => c.phone));
  for (let i = 0; i < 40; i += 1) {
    const key = `F${i + 1}`;
    let phone;
    do { phone = `+79${pick(PREF).slice(1)}${String(ri(1000000, 9999999))}`; } while (used.has(phone));
    used.add(phone);
    const fn = FIRST[i];
    const ln = LAST[(i * 7) % LAST.length];
    const kind = pick(KINDS);
    const zones = uniq(rnd() < 0.3 ? [pick(ZONEW), pick(ZONEW)] : [pick(ZONEW)]);
    const primDays0 = ri(80, 720);
    addClient(key, {
      fn, ln, phone,
      birth: `${ri(1970, 2003)}-${String(ri(1, 12)).padStart(2, '0')}-${String(ri(1, 28)).padStart(2, '0')}`,
      source: pick(SOURCES),
      tags: rnd() < 0.18 ? ['Постоянная'] : [],
      contact: { kind, handle: kind === 'phone' || kind === 'wa' ? '' : `client${i + 101}` },
      pd: ago(primDays0), pc: ago(primDays0), health: health(primDays0),
    });
    zones.forEach((zone, zi) => {
      const primDays = zi === 0 ? primDays0 : Math.max(80, primDays0 - ri(0, 60));
      const recipes = RECIPE[zone];
      let recipe = ri(0, recipes.length - 1);
      let prim;
      if (zone === 'brows') { prim = recipe === 3 ? 's_brows_hair' : 's_brows_powder'; }
      else if (zone === 'lips') prim = pick(['s_lips_lipstick', 's_lips_aqua']);
      else if (zone === 'lash') prim = 's_lash';
      else if (zone === 'undereye') { prim = 's_camo_undereye'; recipe = 0; }
      else { prim = 's_camo_scar'; recipe = 0; }
      const disc = rnd() < 0.12 ? pct(10, 'Постоянная клиентка') : rnd() < 0.1 ? rub(500, 'Акция') : undefined;
      addProc(key, primDays, prim, { recipe, discount: disc, payment: pick(PAY), healing: pick(['good', 'good', 'good', 'uneven', 'faded', 'shade']), photos: rnd() < 0.35 ? ['before', 'after'] : [], pv: ri(0, 3) });
      const corrSvc = { brows: 's_brows_corr', lips: 's_lips_corr', lash: 's_lash_corr' }[zone] || 's_camo_repeat';
      const corrDays = primDays - ri(32, 48);
      if (rnd() < 0.07) addProc(key, corrDays + 4, corrSvc, { recipe, zone, status: 'noshow' });
      addProc(key, corrDays, corrSvc, { recipe, zone, payment: pick(PAY), discount: rnd() < 0.1 ? pct(10, 'Повторная процедура') : undefined });
      const updSvc = { brows: 's_brows_upd', lips: 's_lips_upd', lash: 's_lash_upd' }[zone];
      if (updSvc && corrDays > 365 && rnd() < 0.85) {
        const updDays = corrDays - ri(365, 470);
        if (updDays >= 3) addProc(key, updDays, updSvc, { recipe, payment: pick(PAY), discount: rnd() < 0.4 ? pct(10, 'Постоянная клиентка') : undefined });
      }
    });
  }

  // Сертификаты
  const cert = (id, no, amount, soldDays, buyer, recipient, payment, extra = {}) => ({ id, no, amount, soldAt: ago(soldDays), validTo: addDays(ago(soldDays), 180), buyer, recipient, payment, note: '', usedProcId: '', usedAt: '', ...extra });
  S0.certificates = [
    cert('cert_1', 'С-001', 5000, 120, 'Андрей, подарок жене', '', 'card'),
    cert('cert_2', 'С-002', 5000, 80, 'Муж Марины Зайцевой', 'Марина Зайцева', 'transfer', { usedProcId: p20.id, usedAt: p20.date }),
    cert('cert_3', 'С-003', 3000, 260, 'Коллеги, подарок на юбилей', '', 'cash'),
    cert('cert_4', 'С-004', 10000, 12, 'Ирина К.', 'Мама', 'card'),
    cert('cert_5', 'С-005', 7000, 30, 'Подруги Алины', 'Алина Фёдорова', 'transfer'),
  ];
  S0.settings.nextCertNo = 6;
  S0.expenses = demoExpenses(T);

  // Номера карт — по дате первого визита, начиная с № 1
  const firstDate = new Map();
  for (const p of S0.procedures) {
    const f = firstDate.get(p.clientId);
    if (!f || p.date < f) firstDate.set(p.clientId, p.date);
  }
  for (const c of S0.clients) c.createdAt = firstDate.get(c.id) || c.createdAt;
  S0.clients.sort((a, b) => (a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0));
  S0.clients.forEach((c, i) => { c.cardNo = i + 1; });
  S0.settings.nextCardNo = S0.clients.length + 1;
  S0.settings.lastBackup = ago(34);
  return S0;
}

const LS_KEY = 'ketsal-crm-demo-v1';

// ── Фото ──
const PhotoDB = (() => {
  let db = null;
  const mem = new Map();
  const open = () => new Promise((resolve) => {
    try {
      const req = indexedDB.open('ketsal-crm-photos', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
      req.onsuccess = () => { db = req.result; resolve(); };
      req.onerror = () => resolve();
      req.onblocked = () => resolve();
    } catch (e) {
      resolve();
    }
  });
  async function loadAll() {
    await open();
    if (!db) return;
    await new Promise((resolve) => {
      try {
        const req = db.transaction('photos', 'readonly').objectStore('photos').getAll();
        req.onsuccess = () => { for (const p of req.result || []) mem.set(p.id, p.data); resolve(); };
        req.onerror = () => resolve();
      } catch (e) {
        resolve();
      }
    });
  }
  const tx = (fn) => {
    if (!db) return;
    try { fn(db.transaction('photos', 'readwrite').objectStore('photos')); } catch (e) { /* фото останется только в памяти */ }
  };
  return {
    loadAll,
    get: (id) => mem.get(id),
    put(id, data) { mem.set(id, data); tx((st) => st.put({ id, data })); },
    del(id) { if (!id || String(id).startsWith('demo:')) return; mem.delete(id); tx((st) => st.delete(id)); },
    clear() { mem.clear(); tx((st) => st.clear()); },
    entries: () => Array.from(mem.entries()),
  };
})();

function photoSrc(id) {
  if (!id) return '';
  if (String(id).startsWith('demo:')) return demoPhoto(id);
  return PhotoDB.get(id) || demoPhoto('demo:doc:doc:1');
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

// Перерисовка через canvas: уменьшаем до 1600 px и заодно удаляем EXIF с геометкой (SPEC §8)
async function processPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const max = 1600;
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k));
    const h = Math.max(1, Math.round(img.naturalHeight * k));
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const id = uid('ph');
    PhotoDB.put(id, cv.toDataURL('image/jpeg', 0.82));
    return id;
  } finally {
    URL.revokeObjectURL(url);
  }
}

let fileHandler = null;
function pickPhotos(onDone, multiple = true) {
  const inp = $('#file-input');
  inp.multiple = multiple;
  inp.value = '';
  fileHandler = onDone;
  inp.click();
}
async function onFilesPicked(e) {
  const files = Array.from(e.target.files || []);
  const handler = fileHandler;
  fileHandler = null;
  if (!handler || !files.length) return;
  const ids = [];
  for (const f of files) {
    try {
      ids.push(await processPhoto(f));
    } catch (err) {
      toast('Не получилось открыть фото. В заглушке на компьютере формат HEIC не читается');
    }
  }
  if (ids.length) handler(ids);
}

// ── Имитация синхронизации с Яндекс Диском ──
const sync = { status: 'ok', at: Date.now() };
let syncTimer = null;
function markDirty() {
  sync.status = 'pending';
  renderSyncBits();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    sync.status = navigator.onLine === false ? 'offline' : 'ok';
    sync.at = Date.now();
    renderSyncBits();
  }, 1300);
}
function syncText() {
  if (sync.status === 'pending') return 'Сохраняем на Яндекс Диск…';
  if (sync.status === 'offline') return 'Нет сети. Изменения сохранены на телефоне';
  const min = Math.floor((Date.now() - sync.at) / 60000);
  return `Синхронизировано ${min < 1 ? 'только что' : `${pl(min, 'минуту', 'минуты', 'минут')} назад`}`;
}
function renderSyncBits() {
  for (const el of $$('[data-sync-text]')) el.textContent = syncText();
  for (const el of $$('[data-sync-icon]')) el.dataset.state = sync.status;
}

// Предметная логика: индексы, сводка по клиентке, напоминания о коррекции и обновлении,
// поиск, предупреждения при записи процедуры, отчёты.

let IDX = null;

const isAfter = (a, b) => a.date > b.date || (a.date === b.date && (a.createdAt || '') > (b.createdAt || ''));
const byDateDesc = (a, b) => (isAfter(a, b) ? -1 : isAfter(b, a) ? 1 : 0);

function reindex() {
  IDX = {
    client: new Map(S.clients.map((x) => [x.id, x])),
    proc: new Map(S.procedures.map((x) => [x.id, x])),

    pigment: new Map(S.pigments.map((x) => [x.id, x])),
    needle: new Map(S.needles.map((x) => [x.id, x])),

    zone: new Map(S.zones.map((x) => [x.id, x])),
    course: new Map(S.courses.map((x) => [x.id, x])),
    cert: new Map(S.certificates.map((x) => [x.id, x])),
    byClient: new Map(),

    views: new Map(),
    today: todayISO(),
  };
  for (const p of S.procedures) {

const procsOf = (clientId) => IDX.byClient.get(clientId) || [];
const zoneName = (id) => (IDX.zone.get(id) ? IDX.zone.get(id).name : '—');
const serviceName = (id) => (IDX.service.get(id) ? IDX.service.get(id).name : 'Услуга удалена');
const pigmentLabel = (id) => (IDX.pigment.get(id) ? IDX.pigment.get(id).name : 'Пигмент удалён');
const pigmentFull = (id) => (IDX.pigment.get(id) ? `${IDX.pigment.get(id).brand} · ${IDX.pigment.get(id).name}` : 'Пигмент удалён');
const needleName = (id) => (IDX.needle.get(id) ? IDX.needle.get(id).name : '—');
const anestName = (id) => (IDX.anest.get(id) ? IDX.anest.get(id).name : '—');
const courseName = (id) => (IDX.course.get(id) ? IDX.course.get(id).name : 'Курс не указан');
const fullName = (c) => [c.firstName, c.lastName].filter(Boolean).join(' ');
const formalName = (c) => [c.lastName, c.firstName, c.middleName].filter(Boolean).join(' ');
const initials = (c) => `${(c.firstName || '')[0] || ''}${(c.lastName || '')[0] || ''}`.toUpperCase() || '·';

function discountAmount(price, d) {
  if (!d || !d.value) return 0;
  const v = Number(d.value) || 0;
  return d.mode === 'pct' ? Math.round((price * clamp(v, 0, 100)) / 100) : clamp(v, 0, price);
}
const totalOf = (p) => Math.max(0, (Number(p.price) || 0) - discountAmount(Number(p.price) || 0, p.discount));
function discountText(p) {
  if (!p.discount || !p.discount.value) return '';
  return p.discount.mode === 'pct' ? `${p.discount.value}${NBSP}%` : fmtMoney(p.discount.value);
}

function hasHealthData(c) {
  const h = c.health;
  if (!h) return false;
  return Object.values(h.flags || {}).some(Boolean) || (h.allergies || []).length > 0 || !!(h.meds || '').trim() || !!(h.other || '').trim();
}
function healthMarks(c) {
  const h = c.health;
  if (!h) return [];
  const out = HEALTH_FLAGS.filter((f) => h.flags && h.flags[f.id]).map((f) => f.label);
  if ((h.allergies || []).length) out.push(`Аллергия: ${h.allergies.join(', ')}`);
  if ((h.meds || '').trim()) out.push(`Принимает: ${h.meds.trim()}`);
  if ((h.other || '').trim()) out.push(h.other.trim());
  return out;
}

function defaultLot(pigmentId, onDate = todayISO()) {
  const p = IDX.pigment.get(pigmentId);
  if (!p || !p.lots.length) return '';
  const valid = p.lots.find((l) => !l.exp || l.exp >= onDate);
  return (valid || p.lots[0]).no;
}
const lotInfo = (pigmentId, no) => (IDX.pigment.get(pigmentId) ? IDX.pigment.get(pigmentId).lots.find((l) => l.no === no) || null : null);

function nextBirthday(birth, T) {
  const b = parseISO(birth);
  const t = parseISO(T);
  const mk = (y) => {
    const d = new Date(y, b.getMonth(), b.getDate());
    if (d.getMonth() !== b.getMonth()) d.setDate(0);
    return d;
  };
  let n = mk(t.getFullYear());
  if (n < t) n = mk(t.getFullYear() + 1);
  return toISO(n);
}

// Сводка по клиентке: визиты, траты, напоминания
function clientInfo(c) {
  const cached = IDX.info.get(c.id);
  if (cached) return cached;
  const T = IDX.today;
  const st = S.settings;
  const procs = procsOf(c.id);
  const done = procs.filter((p) => p.status === 'done');
  const last = done[0] || null;
  const first = done.length ? done[done.length - 1] : null;
  const zones = uniq(done.map((p) => p.zone));
  const corr = [];
  const upd = [];
  for (const z of zones) {
    const inZone = done.filter((p) => p.zone === z);
    const latest = inZone[0];
    if (latest.type === 'removal') continue;
    const lastPrimary = inZone.find((p) => p.type === 'primary' || p.type === 'cover');
    if (lastPrimary) {
      const satisfied = inZone.some((p) => (p.type === 'correction' || p.type === 'update') && isAfter(p, lastPrimary));
      if (!satisfied) {
        const days = daysBetween(lastPrimary.date, T);
        if (days < st.corrFrom - 7) continue;
        if (days <= st.corrTo + 60) {
          corr.push({
            kind: 'corr', zone: z, proc: lastPrimary, days,
            state: days < st.corrFrom ? 'soon' : days <= st.corrTo ? 'now' : 'late',
            winFrom: addDays(lastPrimary.date, st.corrFrom), winTo: addDays(lastPrimary.date, st.corrTo),
            key: `corr:${lastPrimary.id}`,
          });
          continue;
        }
      }
    }
    const zd = IDX.zone.get(z);
    if (!zd || !zd.update) continue;
    const months = monthsBetween(latest.date, T);
    if (months >= st.updFrom && months < st.lostAfter) {
      upd.push({ kind: 'upd', zone: z, proc: latest, months, state: months < st.updTo ? 'now' : 'late', key: `upd:${latest.id}` });
    }
  }
  let bday = null;
  if (isISO(c.birth)) {
    const next = nextBirthday(c.birth, T);
    bday = { date: next, inDays: daysBetween(T, next), age: ageOn(c.birth, next), key: `bday:${next}` };
  }
  const inf = {
    procs, done, last, first, zones, corr, upd, bday,
    spent: sum(done, totalOf),
    discounts: sum(done, (p) => discountAmount(p.price, p.discount)),
    visits: done.length,
    lost: !!last && monthsBetween(last.date, T) >= st.lostAfter,
    isModel: (c.tags || []).includes('Модель') || done.some((p) => p.model && p.model.on),
    consentMissing: !(c.consents && c.consents.pd && c.consents.pd.date),
    healthConsentMissing: hasHealthData(c) && !(c.consents && c.consents.health && c.consents.health.date),
    procConsentMissing: !(c.consents && c.consents.procedure && c.consents.procedure.date),
    healthMissing: !(c.health && c.health.filledAt),
  };
  IDX.info.set(c.id, inf);
  return inf;
}

const remindedAt = (c, key) => (c.reminded && c.reminded[key]) || '';
const recentlyReminded = (c, key) => {
  const d = remindedAt(c, key);
  return !!d && daysBetween(d, IDX.today) < 14;
};
function markReminded(c, key) {
  if (!key) return;
  c.reminded = c.reminded || {};
  c.reminded[key] = todayISO();
}

function sortClientItems(items, mode) {
  const coll = new Intl.Collator('ru');
  if (mode === 'card') items.sort((a, b) => b.c.cardNo - a.c.cardNo);
  else if (mode === 'recent') {
    const k = (x) => (x.inf.last ? x.inf.last.date : x.c.createdAt);
    items.sort((a, b) => (k(a) < k(b) ? 1 : k(a) > k(b) ? -1 : 0));
  } else items.sort((a, b) => coll.compare(`${a.c.lastName} ${a.c.firstName}`, `${b.c.lastName} ${b.c.firstName}`));
  return items;
}

function viewItems(view) {
  if (IDX.views.has(view)) return IDX.views.get(view);
  const out = [];
  for (const c of S.clients) {
    const inf = clientInfo(c);
    if (view === 'all') out.push({ c, inf });
    else if (view === 'corr') inf.corr.forEach((it) => out.push({ c, inf, it }));
    else if (view === 'upd') inf.upd.forEach((it) => out.push({ c, inf, it }));
    else if (view === 'bday') { if (inf.bday && inf.bday.inDays <= 30) out.push({ c, inf, it: { kind: 'bday', key: inf.bday.key } }); }
    else if (view === 'models') { if (inf.isModel) out.push({ c, inf }); }
    else if (view === 'lost') { if (inf.lost) out.push({ c, inf, it: { kind: 'lost', key: `lost:${inf.last.id}` } }); }
    else if (view === 'noconsent') { if (inf.consentMissing || inf.healthConsentMissing) out.push({ c, inf }); }
  }
  const rr = (x) => (recentlyReminded(x.c, x.it.key) ? 1 : 0);
  if (view === 'corr') {
    const rank = { late: 0, now: 1, soon: 2 };
    out.sort((a, b) => rr(a) - rr(b) || rank[a.it.state] - rank[b.it.state] || b.it.days - a.it.days);
  } else if (view === 'upd') out.sort((a, b) => rr(a) - rr(b) || b.it.months - a.it.months);
  else if (view === 'bday') out.sort((a, b) => a.inf.bday.inDays - b.inf.bday.inDays);
  else if (view === 'lost') out.sort((a, b) => (a.inf.last.date < b.inf.last.date ? 1 : -1));
  else sortClientItems(out, UI.clientSort);
  IDX.views.set(view, out);
  return out;
}

// Значок на вкладке: коррекции, у которых окно уже открыто, и о них ещё не напомнили
function urgentCount() {
  return viewItems('corr').filter((x) => x.it.state !== 'soon' && !recentlyReminded(x.c, x.it.key)).length;
}

function searchClients(q) {
  const raw = String(q || '').trim();
  if (!raw) return [];
  const res = [];
  if (/^[\d\s()+\-№.]+$/.test(raw)) {
    const card = raw.replace(/[^\d]/g, '');
    const digits = phoneQueryDigits(raw);
    for (const c of S.clients) {
      const byCard = String(c.cardNo) === card;
      const byPhone = digits.length >= 3 && String(c.phone).replace(/\D/g, '').includes(digits);
      if (byCard || byPhone) res.push({ c, inf: clientInfo(c), byCard });
    }
    res.sort((a, b) => (b.byCard ? 1 : 0) - (a.byCard ? 1 : 0) || a.c.cardNo - b.c.cardNo);
    return res;
  }
  const words = norm(raw).split(/\s+/).filter(Boolean);
  for (const c of S.clients) {
    const hay = norm(`${c.lastName} ${c.firstName} ${c.middleName} ${(c.contact && c.contact.handle) || ''}`);
    if (words.every((w) => hay.includes(w))) res.push({ c, inf: clientInfo(c) });
  }
  return sortClientItems(res, 'name');
}

const findByPhone = (phone, exceptId) => {
  const p = normPhone(phone);
  if (!p || p.length < 12) return null;
  return S.clients.find((c) => c.phone === p && c.id !== exceptId) || null;
};

// ── Процедуры: черновики формы ──
function newProcDraft(clientId, date = todayISO()) {
  return {
    id: null, clientId, date, serviceId: '', type: 'primary', zone: '', technique: '',
    anesthesia: { primary: '', secondary: '' }, pigments: [], needles: [],
    photos: { before: [], after: [], month: [] }, healing: { status: '', note: '' },
    prevHealing: null, note: '', price: 0, discount: { mode: 'pct', value: 0, reason: '' },
    payment: 'card', certificateId: '', status: 'done', model: { on: false, courseId: '' },
  };
}
const lastInZone = (clientId, zone, exceptId) => procsOf(clientId).find((p) => p.status === 'done' && p.zone === zone && p.type !== 'removal' && p.id !== exceptId) || null;
const findService = (zone, type) => S.services.find((s) => s.active && s.type === type && s.zones.includes(zone)) || null;

function healingTarget(d) {
  if (d.type !== 'correction' || !d.zone) return null;
  return procsOf(d.clientId).find((p) => p.status === 'done' && p.zone === d.zone && p.id !== d.id && (p.type === 'primary' || p.type === 'cover') && p.date <= d.date) || null;
}
function syncPrevHealing(d) {
  const t = healingTarget(d);
  if (!t) { d.prevHealing = null; return; }
  if (!d.prevHealing || d.prevHealing.procId !== t.id) {
    d.prevHealing = { procId: t.id, status: (t.healing && t.healing.status) || '', note: (t.healing && t.healing.note) || '' };
  }
}

// «Повторить как в прошлый раз»: материалы из последней процедуры в зоне, партии — актуальные
function repeatDraft(clientId, zone, baseId) {
  const base = baseId ? IDX.proc.get(baseId) : lastInZone(clientId, zone);
  const d = newProcDraft(clientId);
  if (!base) { d.zone = zone || ''; return d; }
  const c = IDX.client.get(clientId);
  const inf = clientInfo(c);
  d.zone = base.zone;
  d.technique = base.technique || '';
  d.anesthesia = { ...base.anesthesia };
  d.needles = base.needles.slice();
  d.pigments = base.pigments.map((pg) => ({ pigmentId: pg.pigmentId, lot: defaultLot(pg.pigmentId) || pg.lot, ratio: pg.ratio || '' }));
  const pendingCorr = inf.corr.find((x) => x.zone === base.zone);
  d.type = base.type === 'removal' ? 'removal' : pendingCorr ? 'correction' : 'update';
  const svc = (d.type === 'removal' && IDX.service.get(base.serviceId)) || findService(d.zone, d.type);
  if (svc) { d.serviceId = svc.id; d.price = svc.price; }
  d.repeatedFrom = base.id;
  syncPrevHealing(d);
  return d;
}

function draftFromProc(p) {
  const d = deepClone(p);
  d.photos = d.photos || { before: [], after: [], month: [] };
  d.healing = d.healing || { status: '', note: '' };
  d.model = d.model || { on: false, courseId: '' };
  d.prevHealing = null;
  syncPrevHealing(d);
  return d;
}

function procWarnings(d) {
  const c = IDX.client.get(d.clientId);
  if (!c) return [];
  const w = [];
  const h = c.health;
  const when = d.date || IDX.today;
  if (!h || !h.filledAt) w.push({ level: 'warn', text: 'Анкета здоровья не заполнена', act: 'open-health', btn: 'Заполнить' });
  else {
    const m = monthsBetween(h.filledAt, when);
    if (m >= 12) w.push({ level: 'info', text: `Анкета заполнена ${pl(m, 'месяц', 'месяца', 'месяцев')} назад, уточните изменения`, act: 'open-health', btn: 'Обновить' });
    const subs = [d.anesthesia.primary, d.anesthesia.secondary].filter(Boolean).flatMap((id) => (IDX.anest.get(id) ? IDX.anest.get(id).substances : []));
    const allergies = (h.allergies || []).map(norm).filter(Boolean);
    const hits = allergies.filter((a) => subs.some((s) => norm(s).includes(a) || a.includes(norm(s))));
    if (hits.length) w.push({ level: 'danger', text: `Аллергия на ${hits.join(', ')}. Выбранная анестезия содержит это вещество` });
    else if (allergies.length) w.push({ level: 'warn', text: `Аллергия по анкете: ${allergies.join(', ')}` });
    const flags = HEALTH_FLAGS.filter((f) => h.flags && h.flags[f.id]);
    flags.filter((f) => f.zones && f.zones.includes(d.zone)).forEach((f) => w.push({ level: 'danger', text: `В анкете: ${lc(f.label)}. Учтите перед процедурой в этой зоне` }));
    const general = flags.filter((f) => !f.zones);
    if (general.length) w.push({ level: 'warn', text: `В анкете отмечено: ${general.map((f) => lc(f.label)).join('; ')}` });
    if ((h.meds || '').trim()) w.push({ level: 'info', text: `Принимает: ${h.meds.trim()}` });
  }
  if (!c.consents || !c.consents.procedure || !c.consents.procedure.date) w.push({ level: 'warn', text: 'Нет согласия на процедуру', act: 'open-consents', btn: 'Добавить' });
  if (!c.consents || !c.consents.pd || !c.consents.pd.date) w.push({ level: 'warn', text: 'Нет согласия на обработку персональных данных', act: 'open-consents', btn: 'Добавить' });
  else if (hasHealthData(c) && !(c.consents.health && c.consents.health.date)) w.push({ level: 'warn', text: 'Нет согласия на обработку данных о здоровье', act: 'open-consents', btn: 'Добавить' });
  for (const pg of d.pigments) {
    if (!pg.pigmentId) continue;
    const lot = lotInfo(pg.pigmentId, pg.lot);
    if (lot && lot.exp && lot.exp < when) w.push({ level: 'danger', text: `Партия ${pg.lot} (${pigmentLabel(pg.pigmentId)}) просрочена: годна до ${fmtMonthNum(lot.exp)}` });
    const reaction = procsOf(c.id).find((p) => p.id !== d.id && p.healing && p.healing.status === 'reaction' && p.pigments.some((x) => x.pigmentId === pg.pigmentId));
    if (reaction) w.push({ level: 'danger', text: `Была реакция на пигмент «${pigmentLabel(pg.pigmentId)}» после процедуры ${fmtDate(reaction.date)}` });
  }
  return w;
}

function certStatus(cert) {
  if (cert.usedProcId) return 'used';
  if (cert.validTo && cert.validTo < IDX.today) return 'expired';
  return 'active';
}
const CERT_STATUS_LABEL = { active: 'Действует', used: 'Использован', expired: 'Срок истёк' };
function availableCerts(d) {

// ── Отчёты ──
function periodRange(mode, cursor) {
  if (mode === 'year') {
    const y = cursor.slice(0, 4);
    return [`${y}-01-01`, `${y}-12-31`];
  }
  return [startOfMonth(cursor), endOfMonth(cursor)];
}
const periodLabel = (mode, cursor) => (mode === 'year' ? `${cursor.slice(0, 4)} год` : fmtMonthYear(cursor));

function groupBy(arr, keyFn, valFn) {
  const m = new Map();
  for (const x of arr) {
    for (const k of [].concat(keyFn(x))) {
      if (!k) continue;
      const g = m.get(k) || { key: k, count: 0, value: 0 };
      g.count += 1;
      g.value += valFn ? valFn(x) : 0;
      m.set(k, g);
    }
  }
  return Array.from(m.values());
}

function reportData(mode, cursor) {
  const [a, b] = periodRange(mode, cursor);
  const inR = (d) => d >= a && d <= b;
  const ps = S.procedures.filter((p) => inR(p.date));
  const done = ps.filter((p) => p.status === 'done');
  const revenue = sum(done, totalOf);
  const disc = (p) => discountAmount(p.price, p.discount);
  const newClients = S.clients.filter((c) => {
    const f = clientInfo(c).first;
    return f && inR(f.date);
  });
  const certsSold = S.certificates.filter((c) => inR(c.soldAt));
  const exps = (S.expenses || []).filter((e) => inR(e.date));
  return {
    expenses: sum(exps, (e) => e.amount),
    byExpense: groupBy(exps, (e) => e.category || 'Другое', (e) => e.amount).sort((x, y) => y.value - x.value),
    a, b,
    count: done.length,
    revenue,
    avg: done.length ? Math.round(revenue / done.length) : 0,
    discounts: sum(done, disc),
    noshow: ps.filter((p) => p.status !== 'done').length,
    newClients: newClients.length,
    byService: groupBy(done, (p) => p.serviceId, totalOf).sort((x, y) => y.value - x.value),
    byZone: groupBy(done, (p) => p.zone, totalOf).sort((x, y) => y.count - x.count),
    byType: groupBy(done, (p) => p.type, totalOf).sort((x, y) => y.count - x.count),
    byPigment: groupBy(done, (p) => uniq(p.pigments.map((g) => g.pigmentId))).sort((x, y) => y.count - x.count),
    byReason: groupBy(done.filter((p) => disc(p) > 0), (p) => p.discount.reason || 'Без причины', disc).sort((x, y) => y.value - x.value),
    bySource: groupBy(newClients, (c) => c.source || 'Не указано').sort((x, y) => y.count - x.count),
    byCourse: groupBy(done.filter((p) => p.model && p.model.on), (p) => p.model.courseId || 'none', disc).sort((x, y) => y.count - x.count),
    byPayment: groupBy(done, (p) => p.payment, totalOf).sort((x, y) => y.value - x.value),
    certsSold: certsSold.length,
    certsSum: sum(certsSold, (c) => c.amount),
  };
}

function monthlySeries(endISO, n = 12) {
  const out = [];
  for (let i = n - 1; i >= 0; i -= 1) {
    const m = addMonths(startOfMonth(endISO), -i);
    const ym = m.slice(0, 7);
    const done = S.procedures.filter((p) => p.status === 'done' && p.date.startsWith(ym));
    const expenses = sum((S.expenses || []).filter((e) => e.date.startsWith(ym)), (e) => e.amount);
    out.push({ ym, iso: m, label: MONTHS_AXIS[parseISO(m).getMonth()], year: m.slice(0, 4), revenue: sum(done, totalOf), count: done.length, expenses });
  }
  return out;
}

// ── Шаблоны сообщений ──
function fillTemplate(tpl, c, it) {
  const zoneTxt = it && it.zone ? lc(zoneName(it.zone)) : 'процедура';
  const days = it && it.proc ? daysBetween(it.proc.date, IDX.today) : '';
  return String(tpl || '')
    .replace(/\{имя\}/g, c.firstName || '')
    .replace(/\{зона\}/g, zoneTxt)
    .replace(/\{дата\}/g, it && it.proc ? fmtDate(it.proc.date, true) : '')
    .replace(/\{дней\}/g, String(days));
}

const TABS = [

  { id: 'procedures', label: 'Процедуры', icon: 'calendar', path: '/procedures' },

  { id: 'more', label: 'Ещё', icon: 'dots', path: '/more' },
];
const ROUTES = [];
function route(test, render, opts = {}) { ROUTES.push({ test, render, ...opts }); }

function parseRoute() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/clients';
  const parts = h.split('?')[0].split('/').filter(Boolean);
  return { path: `/${parts.join('/')}`, parts };
}

const navStack = [];
function go(path) {
  const cur = parseRoute().path;
  if (cur === path) { render(); return; }
  navStack.push(cur);
  location.hash = path;
}
function goReplace(path) {
  history.replaceState(null, '', `#${path}`);
  render();
}
function goBack(fallback) {
  const prev = navStack.pop();
  if (prev) goReplace(prev);
  else goReplace(fallback || TABS.find((t) => t.id === UI.tab).path);
}
function switchTab(id) {
  const t = TABS.find((x) => x.id === id);
  navStack.length = 0;
  UI.tab = id;
  goReplace(t.path);
}

function render() {
  if (!S) return;
  const r = parseRoute();
  const rt = ROUTES.find((x) => x.test(r.parts)) || ROUTES[0];
  if (rt.tab) UI.tab = rt.tab;
  const host = $('#screen');
  const same = host.dataset.path === r.path;
  const sc = $('.scroller', host);
  const top = same && sc ? sc.scrollTop : 0;
  host.innerHTML = rt.render(r);

const sheets = [];
function openSheet(def) {
  const el = document.createElement('div');
  el.className = 'sheet-layer';
  el.innerHTML = `<div class="sheet-backdrop" data-act="sheet-dismiss"></div><div class="sheet ${def.auto ? 'sheet--auto' : ''}" role="dialog" aria-modal="true"></div>`;
  $('#overlays').appendChild(el);
  const sh = {
    ...def,
    el,
    update() {
      const box = $('.sheet', el);
      const scr = $('.sheet-scroll', el);
      const top = scr ? scr.scrollTop : 0;
      box.innerHTML = this.render(this);
      const scr2 = $('.sheet-scroll', el);
      if (scr2) scr2.scrollTop = top;
      if (this.after) this.after(this);
    },
    close(result) {
      const i = sheets.indexOf(this);
      if (i >= 0) sheets.splice(i, 1);
      el.classList.remove('open');
      setTimeout(() => el.remove(), 280);
      if (this.onClose) this.onClose(result);
    },
  };
  sheets.push(sh);
  sh.update();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
  return sh;
}
const topSheet = () => sheets[sheets.length - 1] || null;
function closeAllSheets() {
  while (sheets.length) sheets[sheets.length - 1].close('cancel');
}
function sheetHead(title, { left = 'Отмена', leftAct = 'sheet-cancel', right = '', rightAct = '' } = {}) {
  return `<div class="sheet-head">
    ${left ? `<button class="btn btn-ghost" data-act="${leftAct}">${esc(left)}</button>` : '<span></span>'}
    <h2>${esc(title)}</h2>
    ${right ? `<button class="btn btn-ghost" data-act="${rightAct}" style="font-weight:600">${esc(right)}</button>` : '<span></span>'}
  </div>`;
}

// Список действий снизу (как меню iOS)
function actionSheet(title, items) {
  return new Promise((resolve) => {
    let picked = null;
    const sh = openSheet({
      auto: true,
      render: () => `${title ? `<div class="action-title">${esc(title)}</div>` : ''}<div class="action-list">${items.map((it, i) => `<button data-act="pick" data-i="${i}" class="${it.danger ? 'danger' : ''} ${it.on ? 'on' : ''}">${it.icon ? icon(it.icon) : ''}<span>${esc(it.label)}</span></button>`).join('')}<button data-act="sheet-cancel" style="justify-content:center;color:var(--text-2)">Отмена</button></div>`,
      actions: {
        pick(el) { picked = items[Number(el.dataset.i)]; sh.close('ok'); },
      },
      onClose: () => resolve(picked ? picked.value : null),
    });
  });
}

// Диалог подтверждения; requireWord — защита от случайного удаления
function confirmDialog({ title, text = '', ok = 'Удалить', cancel = 'Отмена', danger = true, requireWord = '' }) {
  return new Promise((resolve) => {
    const layer = document.createElement('div');
    layer.className = 'dialog-layer';
    layer.innerHTML = `<div class="sheet-backdrop" data-dlg="no"></div><div class="dialog" role="alertdialog" aria-modal="true">
      <h3>${esc(title)}</h3>${text ? `<p>${text}</p>` : ''}
      ${requireWord ? `<input class="input" data-dlg-word autocomplete="off" placeholder="Введите слово «${esc(requireWord)}»">` : ''}
      <div class="dialog-actions"><button class="btn btn-outline" data-dlg="no">${esc(cancel)}</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-dlg="yes" ${requireWord ? 'disabled' : ''}>${esc(ok)}</button></div></div>`;
    $('#overlays').appendChild(layer);
    const word = $('[data-dlg-word]', layer);
    if (word) {
      word.addEventListener('input', () => { $('[data-dlg="yes"]', layer).disabled = norm(word.value) !== norm(requireWord); });
      setTimeout(() => word.focus(), 50);
    }
    layer.addEventListener('click', (e) => {
      const b = e.target.closest('[data-dlg]');
      if (!b) return;
      layer.remove();
      resolve(b.dataset.dlg === 'yes');
    });
  });
}

let toastTimer = null;

// ── Обработка событий ──
const ACTIONS = {};
const INPUTS = {};
function sheetOf(el) {
  const layer = el.closest('.sheet-layer');
  return layer ? sheets.find((s) => s.el === layer) || null : null;
}
function readValue(el) {
  if (el.type === 'checkbox') return el.checked;
  return el.value;
}
function setPath(obj, path, value) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i += 1) {
    const k = keys[i];
    if (o[k] == null) o[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    o = o[k];
  }
  o[keys[keys.length - 1]] = value;
}
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}

function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    const sh = sheetOf(el);
    if (sh && sh.actions && sh.actions[act]) {
      e.preventDefault();
      sh.actions[act](el, e, sh);
      return;
    }
    if (sh && (act === 'sheet-cancel' || act === 'sheet-dismiss')) {
      e.preventDefault();
      if (sh.onCancel) sh.onCancel(sh); else sh.close('cancel');
      return;
    }
    if (ACTIONS[act]) {
      e.preventDefault();
      ACTIONS[act](el, e);
    }
  });
  const onField = (e, kind) => {
    const el = e.target;
    if (!el.dataset) return;
    const sh = sheetOf(el);
    if (el.dataset.bind && sh) {
      const handler = kind === 'input' ? sh.onInput : sh.onChange;
      if (handler) handler.call(sh, el.dataset.bind, readValue(el), el, e);
      return;
    }
    const key = el.dataset[kind === 'input' ? 'in' : 'ch'];
    if (key && INPUTS[key]) INPUTS[key](el, e);
  };
  document.addEventListener('input', (e) => onField(e, 'input'));
  document.addEventListener('change', (e) => onField(e, 'change'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('#viewer').classList.contains('show')) { closeViewer(); return; }
      if ($('#print-root').classList.contains('show')) { closePrint(); return; }
      const sh = topSheet();
      if (sh) { if (sh.onCancel) sh.onCancel(sh); else sh.close('cancel'); }
    }
  });
  window.addEventListener('hashchange', () => {
    const cur = parseRoute().path;
    if (navStack.length && navStack[navStack.length - 1] === cur) navStack.pop();
    render();
  });
  $('#file-input').addEventListener('change', onFilesPicked);
}

function clientListHtml() {

function rowBadge(c, inf, view) {

    return p ? `<span class="pill pill--line">${esc(fmtDateShort(p.date))}</span>` : '';
  }
  const corr = inf.corr.find((x) => x.state !== 'soon') || inf.corr[0];
  if (corr) {
    const dot = corr.state === 'late' ? 'dot--alert' : corr.state === 'soon' ? 'dot--muted' : '';
