function notFoundScreen(text) {
  return `<div class="screen">${navBar({ title: '' })}<div class="scroller"><div class="empty"><div class="display">${esc(text)}</div><p>Возможно, её удалили.</p></div></div></div>`;
}

function screenClient(r) {
  const c = IDX.client.get(r.parts[1]);
  if (!c) return notFoundScreen('Карта не найдена');
  const inf = clientInfo(c);
  const tab = UI.clientTab[c.id] || 'history';
  const tags = (c.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('');
  const tabs = [['history', 'История'], ['photos', 'Фото'], ['data', 'Данные']];
  let body;
  if (tab === 'photos') body = clientPhotos(c, inf);
  else if (tab === 'data') body = clientData(c, inf);
  else body = clientHistory(c, inf);
  return `<div class="screen">
    ${navBar({ title: `Карта № ${c.cardNo}`, right: `<button class="icon-btn icon-btn--accent" data-act="client-menu" data-id="${c.id}" aria-label="Действия с картой">${icon('dots')}</button>` })}
    <div class="scroller scroller--bar">
      <section class="profile">
        ${avatarHtml(c, 'avatar--xl')}
        <h1 class="display profile-name">${esc(fullName(c))}</h1>
        <div class="profile-meta">${esc(fmtPhone(c.phone))}${inf.first ? ` · с ${esc(fmtDate(inf.first.date, true))}` : ''}</div>
        ${tags ? `<div class="profile-tags">${tags}</div>` : ''}
        <div class="quick">
          <button data-act="call" data-id="${c.id}">${icon('phone')}Позвонить</button>
          <button data-act="message" data-id="${c.id}">${icon('message')}Написать</button>
          <button data-act="print-client" data-id="${c.id}">${icon('print')}PDF</button>
        </div>
      </section>
      ${clientAlerts(c, inf)}
      <div class="stats">
        <div class="stat"><div class="stat-v">${inf.visits}</div><div class="stat-l">${plural(inf.visits, 'визит', 'визита', 'визитов')}</div></div>
        <div class="stat"><div class="stat-v">${fmtMoney(inf.spent)}</div><div class="stat-l">потрачено</div></div>
        <div class="stat"><div class="stat-v">${inf.last ? fmtDateShort(inf.last.date) : '—'}</div><div class="stat-l">последний визит</div></div>
      </div>
      <div class="seg seg--card" role="tablist">${tabs.map(([id, l]) => `<button role="tab" class="${tab === id ? 'on' : ''}" aria-selected="${tab === id}" data-act="client-tab" data-id="${c.id}" data-tab="${id}">${l}</button>`).join('')}</div>
      <div id="client-tab">${body}</div>
    </div>
    <div class="bottom-bar"><button class="btn btn-primary btn-block" data-act="new-proc" data-id="${c.id}">${icon('plus')} Процедура</button></div>
  </div>`;
}

function noticeHtml(ic, text, btn, attrs) {
  return `<div class="notice">${icon(ic, 'i-sm')}<span>${esc(text)}</span><button class="btn btn-sm btn-secondary" ${attrs}>${esc(btn)}</button></div>`;
}

function reminderCard(c, it) {
  const p = it.proc;
  const reminded = remindedAt(c, it.key);
  const title = `${it.kind === 'corr' ? 'Коррекция' : 'Обновление'} · ${lc(zoneName(it.zone))}`;
  const sub = `${TYPE_LABEL[p.type]} ${fmtDate(p.date)}${p.technique ? ` · ${lc(p.technique)}` : ''}${it.kind === 'corr' ? ` · окно ${fmtDateShort(it.winFrom)} – ${fmtDateShort(it.winTo)}` : ''}`;
  return `<div class="rem rem--accent">
    <div class="rem-head"><span class="dot ${dueDot(it)}"></span><span>${esc(title)}</span><span class="rem-state">${esc(dueState(it))}</span></div>
    <div class="rem-sub">${esc(sub)}</div>
    ${reminded ? `<div class="rem-note">Напомнили ${esc(relDay(reminded))}</div>` : ''}
    <div class="rem-actions"><button class="btn btn-primary btn-sm" data-act="repeat" data-id="${c.id}" data-zone="${it.zone}">${icon('repeat')} Повторить как в прошлый раз</button><button class="btn btn-outline btn-sm" style="flex:0 0 auto;padding:0 12px" data-act="message" data-id="${c.id}" data-kind="${it.kind}" data-key="${esc(it.key)}" aria-label="Написать напоминание">${icon('message')}</button></div>
  </div>`;
}

function clientAlerts(c, inf) {
  const out = [];
  for (const it of [...inf.corr, ...inf.upd]) out.push(reminderCard(c, it));
  if (inf.bday && inf.bday.inDays <= 14) {
    const when = inf.bday.inDays === 0 ? 'сегодня' : inf.bday.inDays === 1 ? 'завтра' : fmtDate(inf.bday.date, false);
    out.push(noticeHtml('gift', `День рождения ${when}, исполнится ${inf.bday.age}`, 'Поздравить', `data-act="message" data-id="${c.id}" data-kind="bday" data-key="${esc(inf.bday.key)}"`));
  }
  const missing = [inf.consentMissing && 'на обработку данных', inf.procConsentMissing && inf.procs.length && 'на процедуру', inf.healthConsentMissing && 'на данные о здоровье'].filter(Boolean);
  if (missing.length) out.push(noticeHtml('doc', `Нет согласия ${missing.join(', ')}`, 'Добавить', `data-act="open-consents" data-id="${c.id}"`));
  if (inf.healthMissing) out.push(noticeHtml('health', 'Анкета здоровья не заполнена', 'Заполнить', `data-act="open-health" data-id="${c.id}"`));
  return out.length ? `<div class="alerts">${out.join('')}</div>` : '';
}

function procMaterialsShort(p) {
  const bits = p.pigments.filter((g) => g.pigmentId).map((g) => {
    const pg = IDX.pigment.get(g.pigmentId);
    return `<span><span class="swatch" style="background:${pg ? esc(pg.hex) : 'transparent'}"></span>${esc(pigmentLabel(g.pigmentId))}</span>`;
  });
  if (p.needles.length) bits.push(`<span>${esc(p.needles.map(needleName).join(', '))}</span>`);
  return bits.join('');
}

function procItem(p, withClient = false) {
  const c = IDX.client.get(p.clientId);
  const dim = p.status !== 'done';
  const mats = procMaterialsShort(p);
  const disc = discountAmount(p.price, p.discount);
  const title = withClient ? (c ? fullName(c) : 'Карта удалена') : serviceName(p.serviceId);
  const meta = [withClient ? serviceName(p.serviceId) : fmtDate(p.date, true), TYPE_LABEL[p.type], dim ? lc(STATUS_LABEL[p.status]) : null].filter(Boolean).join(' · ');
  return `<button class="proc-item ${dim ? 'proc-item--dim' : ''}" data-act="open-proc" data-id="${p.id}">
    <div class="proc-main"><div class="proc-title">${esc(title)}</div><div class="proc-meta">${esc(meta)}</div>${mats && !dim ? `<div class="proc-mat">${mats}</div>` : ''}</div>
    <div class="proc-sum">${dim ? '—' : fmtMoney(totalOf(p))}${disc && !dim ? `<small>скидка ${esc(discountText(p))}</small>` : ''}</div>
  </button>`;
}

function clientHistory(c, inf) {
  if (!inf.procs.length) return '<div class="empty"><p>Процедур пока нет.</p></div>';
  return `<div class="list">${inf.procs.map((p) => procItem(p)).join('')}</div>`;
}

function zonePhotos(c, zone) {
  const out = [];
  const procs = procsOf(c.id).filter((p) => p.zone === zone).slice().reverse();
  for (const p of procs) {
    for (const st of PHOTO_STAGES) {
      for (const id of (p.photos && p.photos[st.id]) || []) out.push({ id, p, stage: st.id });
    }
  }
  return out;
}

function clientPhotos(c) {
  const zones = uniq(procsOf(c.id).filter((p) => PHOTO_STAGES.some((st) => ((p.photos && p.photos[st.id]) || []).length)).map((p) => p.zone));
  if (!zones.length) return '<div class="empty"><p>Фото пока нет. Их добавляют в процедуре: до, сразу после и через месяц.</p></div>';
  const zone = zones.includes(UI.photoZone[c.id]) ? UI.photoZone[c.id] : zones[0];
  const items = zonePhotos(c, zone);
  const groups = [];
  items.forEach((x, i) => {
    let g = groups[groups.length - 1];
    if (!g || g.p.id !== x.p.id) { g = { p: x.p, items: [] }; groups.push(g); }
    g.items.push({ ...x, i });
  });
  return `<div class="chips" style="margin-bottom:12px">${zones.map((z) => chip(zoneName(z), z === zone, `data-act="photo-zone" data-id="${c.id}" data-zone="${z}"`)).join('')}</div>
    <button class="btn btn-secondary btn-sm" style="margin-bottom:16px" data-act="compare" data-id="${c.id}" data-zone="${zone}">${icon('compare')} Сравнить «до» и «через месяц»</button>
    ${groups.map((g) => `<div class="timeline-group"><div class="timeline-head"><b>${esc(fmtDate(g.p.date, true))}</b> · ${esc(TYPE_LABEL[g.p.type])}${g.p.technique ? ` · ${esc(lc(g.p.technique))}` : ''}</div>
      <div class="photo-grid">${g.items.map((x) => `<button class="ph" data-act="view-zone-photos" data-id="${c.id}" data-zone="${zone}" data-i="${x.i}"><img src="${photoSrc(x.id)}" alt="${esc(STAGE_LABEL[x.stage])}, ${esc(fmtDate(x.p.date, true))}" loading="lazy"><div class="ph-cap"><b>${esc(STAGE_LABEL[x.stage])}</b></div></button>`).join('')}</div></div>`).join('')}`;
}

function consentRow(label, cons, notNeeded, k) {
  const has = cons && cons.date;
  const photos = (cons && cons.photos) || [];
  let v;
  if (has) v = `${esc(fmtDate(cons.date, true))}${photos.length ? ` · <button class="btn-link" style="min-height:0" data-act="view-ids" data-ids="${esc(photos.join(','))}" data-cap="${esc(label)}">бланк</button>` : ''}`;
  else if (notNeeded) v = '<span class="muted">не требуется</span>';
  else v = '<span class="dot dot--alert"></span> нет';
  return `<div class="kv" data-consent="${k}"><span class="k">${esc(label)}</span><span class="v">${v}</span></div>`;
}

function healthBlock(c) {
  const h = c.health;
  if (!h || !h.filledAt) return '<div class="muted" style="font-size:15px">Не заполнена</div>';
  const marks = healthMarks(c);
  const head = `Заполнена ${fmtDate(h.filledAt, true)} · ${marks.length ? pl(marks.length, 'отметка', 'отметки', 'отметок') : 'отметок нет'}`;
  if (!marks.length) return `<div style="font-size:15px">${esc(head)}</div>`;
  if (!UI.healthShown[c.id]) {
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-size:15px">${esc(head)}</span><button class="btn btn-sm btn-secondary" data-act="show-health" data-id="${c.id}">${icon('eye', 'i-sm')} Показать</button></div>`;
  }
  return `<div style="font-size:15px;margin-bottom:8px">${esc(head)}</div><ul style="margin:0;padding-left:20px;font-size:15px">${marks.map((m) => `<li>${esc(m)}</li>`).join('')}</ul><button class="btn-link" data-act="show-health" data-id="${c.id}">Скрыть</button>`;
}

function clientData(c, inf) {
  const ct = c.contact && c.contact.kind !== 'phone' ? `${CONTACT_LABEL[c.contact.kind]}${c.contact.handle ? `: ${c.contact.handle}` : ''}` : 'только звонок';
  const cons = c.consents || {};
  return `
    <div class="section-title" style="margin-top:4px">Контакты и данные <button class="btn-link" data-act="edit-client" data-id="${c.id}">Изменить</button></div>
    <div class="card">
      ${kv('ФИО', esc(formalName(c)))}
      ${kv('Телефон', esc(fmtPhone(c.phone)))}
      ${kv('Где переписываемся', esc(ct))}
      ${kv('Дата рождения', c.birth ? esc(`${fmtDate(c.birth, true)}, ${pl(ageOn(c.birth), 'год', 'года', 'лет')}`) : '—')}
      ${kv('Откуда пришла', esc(c.source || '—'))}
      ${kv('Первый визит', inf.first ? esc(fmtDate(inf.first.date, true)) : '—')}
      ${c.notes ? `<div class="kv" style="display:block"><div class="k" style="margin-bottom:4px">Заметки</div><div style="white-space:pre-wrap">${esc(c.notes)}</div></div>` : ''}
    </div>
    <div class="section-title">Согласия <button class="btn-link" data-act="open-consents" data-id="${c.id}">Изменить</button></div>
    <div class="card">${consentRow('На обработку данных', cons.pd, false, 'pd')}${consentRow('На процедуру', cons.procedure, false, 'procedure')}${consentRow('На данные о здоровье', cons.health, !hasHealthData(c), 'health')}</div>
    <div class="section-title">Анкета здоровья <button class="btn-link" data-act="open-health" data-id="${c.id}">${c.health && c.health.filledAt ? 'Изменить' : 'Заполнить'}</button></div>
    <div class="card">${healthBlock(c)}</div>
    <div class="section-title">Итоги</div>
    <div class="card">${kv('Процедур', String(inf.visits))}${kv('Потрачено', fmtMoney(inf.spent))}${kv('Скидки', fmtMoney(inf.discounts))}${kv('Средний чек', inf.visits ? fmtMoney(Math.round(inf.spent / inf.visits)) : '—')}</div>
    <div class="btn-stack" style="margin-top:18px">
      <button class="btn btn-outline" data-act="print-client" data-id="${c.id}">${icon('print')} Печать и PDF карты</button>
      <button class="btn btn-danger" data-act="purge-client" data-id="${c.id}">${icon('trash')} Удалить карту полностью</button>
    </div>`;
}

};

  UI.photoZone[el.dataset.id] = el.dataset.zone;
  render();
};
ACTIONS['show-health'] = (el) => {
  UI.healthShown[el.dataset.id] = !UI.healthShown[el.dataset.id];
  render();
};
ACTIONS['client-menu'] = async (el) => {
  const id = el.dataset.id;
  const v = await actionSheet('', [
    { value: 'edit', label: 'Изменить данные', icon: 'edit' },
    { value: 'health', label: 'Анкета здоровья', icon: 'health' },
    { value: 'consents', label: 'Согласия', icon: 'doc' },
    { value: 'print', label: 'Печать и PDF карты', icon: 'print' },
    { value: 'purge', label: 'Удалить карту полностью', icon: 'trash', danger: true },
  ]);
  if (v === 'edit') openClientForm({ clientId: id });
  else if (v === 'health') openHealthForm(id);
  else if (v === 'consents') openConsentsForm(id);
  else if (v === 'print') openPrint(id);
  else if (v === 'purge') purgeFlow(id);
};
ACTIONS['edit-client'] = (el) => openClientForm({ clientId: el.dataset.id });
ACTIONS['open-health'] = (el) => openHealthForm(el.dataset.id);
ACTIONS['open-consents'] = (el) => openConsentsForm(el.dataset.id);
ACTIONS['print-client'] = (el) => openPrint(el.dataset.id);
ACTIONS['purge-client'] = (el) => purgeFlow(el.dataset.id);
ACTIONS.call = (el) => {
  const c = IDX.client.get(el.dataset.id);
  demoExternal(`Здесь начнётся звонок на ${fmtPhone(c.phone)}. В заглушке номера выдуманные`);
};
ACTIONS.message = (el) => {
  const c = IDX.client.get(el.dataset.id);
  if (c) openMessage(c, el.dataset.kind || '', el.dataset.key || '');
};
ACTIONS['new-proc'] = (el) => openProcForm({ clientId: el.dataset.id });
ACTIONS.repeat = (el) => openProcForm({ clientId: el.dataset.id, draft: repeatDraft(el.dataset.id, el.dataset.zone) });

ACTIONS['view-zone-photos'] = (el) => {
  const c = IDX.client.get(el.dataset.id);
  const items = zonePhotos(c, el.dataset.zone).map((x) => ({ src: photoSrc(x.id), title: STAGE_LABEL[x.stage], sub: `${fmtDate(x.p.date, true)} · ${TYPE_LABEL[x.p.type]} · ${zoneName(x.p.zone)}` }));
  openViewer(items, Number(el.dataset.i) || 0);
};
ACTIONS['view-ids'] = (el) => {
  const ids = el.dataset.ids.split(',').filter(Boolean);
  openViewer(ids.map((id, i) => ({ src: photoSrc(id), title: el.dataset.cap || 'Фото', sub: ids.length > 1 ? `${i + 1} из ${ids.length}` : '' })), 0);
};
ACTIONS.compare = (el) => {
  const c = IDX.client.get(el.dataset.id);
  const items = zonePhotos(c, el.dataset.zone);
  const withMonth = items.filter((x) => x.stage === 'month').pop();
  let a;
  let b;
  if (withMonth) {
    a = items.find((x) => x.p.id === withMonth.p.id && x.stage === 'before') || items.find((x) => x.stage === 'before');
    b = withMonth;
  } else {
    a = items.find((x) => x.stage === 'before');
    b = items.filter((x) => x.stage !== 'before').pop();
  }
  if (!a || !b) { toast('Для сравнения нужно фото «до» и хотя бы одно фото после'); return; }
  const cap = (x) => ({ src: photoSrc(x.id), title: STAGE_LABEL[x.stage], sub: `${x.stage === 'before' ? '' : 'после процедуры '}${fmtDate(x.p.date, true)}` });
  openCompare(cap(a), cap(b));
};

async function purgeFlow(id) {
  const c = IDX.client.get(id);
  if (!c) return;
  const n = procsOf(c.id).length;
  const ok = await confirmDialog({
    title: 'Удалить карту полностью?',
    text: `Удалятся карта № ${c.cardNo}, ${pl(n, 'процедура', 'процедуры', 'процедур')} и все фото, в том числе с Яндекс Диска. Вернуть будет нельзя. Так выполняется просьба клиентки удалить её данные.`,
    ok: 'Удалить навсегда',
    requireWord: 'удалить',
  });
  if (!ok) return;
  for (const p of procsOf(c.id)) {
    for (const st of PHOTO_STAGES) ((p.photos && p.photos[st.id]) || []).forEach((ph) => PhotoDB.del(ph));
    const cert = S.certificates.find((x) => x.usedProcId === p.id);
    if (cert) cert.usedProcId = 'deleted';
  }
  const cons = c.consents || {};
  [c.facePhoto, ...((cons.pd && cons.pd.photos) || []), ...((cons.procedure && cons.procedure.photos) || [])].forEach((ph) => PhotoDB.del(ph));
  S.procedures = S.procedures.filter((p) => p.clientId !== c.id);
  S.clients = S.clients.filter((x) => x.id !== c.id);
  saveState();
  closeAllSheets();
  navStack.length = 0;
  UI.tab = 'clients';
  goReplace('/clients');
  toast(`Карта № ${c.cardNo} удалена полностью`);
}

// ── 08-procs.js
// Экраны «Процедуры» (журнал) и «Процедура» (подробно).

const PROC_PERIODS = [
  { id: 'today', label: 'Сегодня' },
  { id: 'week', label: '7 дней' },
  { id: 'month', label: 'Этот месяц' },
  { id: 'prev', label: 'Прошлый месяц' },
  { id: 'all', label: 'Все' },
];

route((p) => p[0] === 'procedures', screenProcedures, { tab: 'procedures' });
route((p) => p[0] === 'proc' && !!p[1], screenProc);

function procPeriodRange(id) {
  const T = IDX.today;
  if (id === 'today') return [T, T];
  if (id === 'week') return [addDays(T, -6), T];
  if (id === 'month') return [startOfMonth(T), endOfMonth(T)];
  if (id === 'prev') {
    const m = addMonths(startOfMonth(T), -1);
    return [m, endOfMonth(m)];
  }
  return ['0000-01-01', '9999-12-31'];
}

function screenProcedures() {
  return `<div class="screen">
    <header class="topbar">
      <div class="topbar-row"><h1 class="display title-lg">Процедуры</h1><div class="topbar-actions">${syncButton()}</div></div>
      <label class="search">${icon('search', 'i-sm')}<input type="search" id="proc-search" data-in="proc-search" placeholder="Клиент, услуга или пигмент" value="${esc(UI.procSearch)}" autocomplete="off" enterkeyhint="search" aria-label="Поиск по процедурам"><button type="button" class="search-clear" data-act="proc-search-clear" aria-label="Очистить поиск">${icon('close', 'i-sm')}</button></label>
      <div class="chips chips--scroll" role="tablist" aria-label="Период">${PROC_PERIODS.map((p) => chip(p.label, UI.procPeriod === p.id, `data-act="proc-period" data-id="${p.id}" role="tab"`)).join('')}</div>
    </header>
    <div class="scroller"><div id="proc-list">${procListHtml()}</div></div>
    <button class="fab" data-act="new-proc-pick" aria-label="Новая процедура">${icon('plus')}</button>
  </div>`;
}

function procListHtml() {
  const [a, b] = procPeriodRange(UI.procPeriod);
  const words = norm(UI.procSearch).split(/\s+/).filter(Boolean);
  let list = S.procedures.filter((p) => p.date >= a && p.date <= b);
  if (words.length) {
    list = list.filter((p) => {
      const c = IDX.client.get(p.clientId);
      const hay = norm(`${c ? `${c.firstName} ${c.lastName}` : ''} ${serviceName(p.serviceId)} ${zoneName(p.zone)} ${p.technique} ${p.pigments.map((g) => `${pigmentFull(g.pigmentId)} ${g.lot}`).join(' ')} ${p.note}`);
      return words.every((w) => hay.includes(w));
    });
  }
  list.sort(byDateDesc);
  const done = list.filter((p) => p.status === 'done');
  const missed = list.length - done.length;
  const disc = sum(done, (p) => discountAmount(p.price, p.discount));
  const summary = `<div class="card card--mint" style="margin:6px 0 4px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span style="font-weight:600">${pl(done.length, 'процедура', 'процедуры', 'процедур')}</span><span style="font-size:22px;font-weight:600">${fmtMoney(sum(done, totalOf))}</span></div>
    <div class="note" style="margin-top:2px">Скидки ${fmtMoney(disc)}${missed ? ` · не пришли или отменили: ${missed}` : ''}</div>
  </div>`;
  if (!list.length) {
    const txt = words.length ? 'Ничего не нашли' : UI.procPeriod === 'today' ? 'Сегодня процедур пока нет' : 'За этот период процедур нет';
    return `${summary}<div class="empty"><p>${txt}</p><button class="btn btn-primary" data-act="new-proc-pick">${icon('plus')} Новая процедура</button></div>`;
  }
  const groups = [];
  for (const p of list) {
    let g = groups[groups.length - 1];
    if (!g || g.date !== p.date) { g = { date: p.date, items: [] }; groups.push(g); }
    g.items.push(p);
  }
  return summary + groups.map((g) => `<div class="section-title"><span>${esc(dayHeader(g.date))}</span><span class="num">${fmtMoney(sum(g.items.filter((p) => p.status === 'done'), totalOf))}</span></div><div class="list">${g.items.map((p) => procItem(p, true)).join('')}</div>`).join('');
}

function certPayText(cert, total) {
  const diff = total - cert.amount;
  if (diff > 0) return `номинал ${fmtMoney(cert.amount)}, доплата ${fmtMoney(diff)}`;
  if (diff < 0) return `номинал ${fmtMoney(cert.amount)}, больше суммы на ${fmtMoney(-diff)}`;
  return `номинал ${fmtMoney(cert.amount)}`;
}

function photoStageView(p, st) {
  const ids = (p.photos && p.photos[st.id]) || [];
  return `<div class="photo-stage"><div class="photo-stage-label"><span>${st.label}</span></div><div class="photo-strip">${ids.map((id, i) => `<button class="thumb" data-act="view-proc-photos" data-id="${p.id}" data-stage="${st.id}" data-i="${i}"><img src="${photoSrc(id)}" alt="${esc(st.label)}"></button>`).join('')}<button class="photo-add" data-act="quick-photo" data-id="${p.id}" data-stage="${st.id}" aria-label="Добавить фото: ${esc(st.label)}">${icon('camera')}</button></div></div>`;

ACTIONS['delete-proc'] = async (el) => {
  const p = IDX.proc.get(el.dataset.id);
  const ok = await confirmDialog({ title: 'Удалить процедуру?', text: `${esc(serviceName(p.serviceId))}, ${esc(fmtDate(p.date, true))}. Фото этой процедуры тоже удалятся.` });
  if (!ok) return;
  const snapshot = deepClone(p);
  const idx = S.procedures.indexOf(p);
  const cert = S.certificates.find((x) => x.usedProcId === p.id);
  const certSnap = cert ? { id: cert.id, usedProcId: cert.usedProcId, usedAt: cert.usedAt } : null;
  S.procedures.splice(idx, 1);
  if (cert) { cert.usedProcId = ''; cert.usedAt = ''; }
  saveState();
  goBack(`/client/${p.clientId}`);
  toast('Процедура удалена', {
    action: 'Вернуть',
    onAction: () => {
      S.procedures.splice(Math.min(idx, S.procedures.length), 0, snapshot);
      if (certSnap) {
        const x = S.certificates.find((cc) => cc.id === certSnap.id);
        if (x) Object.assign(x, certSnap);
      }
      saveState();
      render();
      toast('Процедура возвращена');
    },
  });
  setTimeout(() => {
    if (!S.procedures.some((x) => x.id === snapshot.id)) {
      for (const st of PHOTO_STAGES) ((snapshot.photos && snapshot.photos[st.id]) || []).forEach((ph) => PhotoDB.del(ph));
    }
  }, 6000);
};

// Формы в нижних шторках: карта клиента, согласия, анкета здоровья, процедура, сообщение, выбор клиента.

const errHtml = (text) => `<div class="field-err"><span class="dot dot--alert"></span>${esc(text)}</div>`;
function field(label, control, err = '', opt = '', wrap = 'label') {
  return `<${wrap} class="field ${err ? 'err' : ''}" ${err ? 'data-err="1"' : ''}><span class="field-label"><span>${esc(label)}</span>${opt ? `<span class="opt">${esc(opt)}</span>` : ''}</span>${control}${err ? errHtml(err) : ''}</${wrap}>`;
}
function thumbHtml(id, delAct, attrs = '', viewAttrs = '') {
  const img = `<img src="${photoSrc(id)}" alt="">`;
  return `<div class="thumb">${viewAttrs ? `<button type="button" style="display:block;width:100%;height:100%" ${viewAttrs}>${img}</button>` : img}<button type="button" class="thumb-del" data-act="${delAct}" ${attrs} aria-label="Удалить фото">${icon('close')}</button></div>`;
}
function scrollToError(sh) {
  setTimeout(() => {
    const el = $('[data-err]', sh.el);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 30);
}
function emptyConsents() {
  return { pd: { date: '', photos: [] }, health: { date: '' }, procedure: { date: '', photos: [] } };
}
function normalizeConsents(cons) {
  const x = cons || {};
  return {
    pd: { date: (x.pd && x.pd.date) || '', photos: ((x.pd && x.pd.photos) || []).slice() },
    health: { date: (x.health && x.health.date) || '' },
    procedure: { date: (x.procedure && x.procedure.date) || '', photos: ((x.procedure && x.procedure.photos) || []).slice() },
  };
}

function consentEditor(d, k, label) {
  const cons = d.consents[k];
  const photos = k === 'health' ? '' : `<div class="photo-strip" style="margin-top:8px">${(cons.photos || []).map((id, i) => thumbHtml(id, 'del-consent-photo', `data-k="${k}" data-i="${i}"`)).join('')}<button type="button" class="photo-add" data-act="add-consent-photo" data-k="${k}" aria-label="Фото подписанного бланка">${icon('doc')}</button></div>`;
  return `<div class="field"><span class="field-label"><span>${esc(label)}</span>${k === 'health' ? '' : '<span class="opt">дата и фото бланка</span>'}</span>
    <div class="inline-actions"><input class="input" type="date" data-bind="consents.${k}.date" value="${esc(cons.date)}" max="${todayISO()}" aria-label="${esc(label)}: дата"><button type="button" class="btn btn-secondary" data-act="consent-today" data-k="${k}">Сегодня</button></div>${photos}</div>`;
}
// Общие действия для редакторов согласий (в форме карты и в отдельной шторке)
function consentActions(d, sh, newPhotos, removed) {
  return {
    'consent-today': (el) => { d.consents[el.dataset.k].date = todayISO(); sh.update(); },
    'add-consent-photo': (el) => pickPhotos((ids) => {
      d.consents[el.dataset.k].photos.push(...ids);
      newPhotos.push(...ids);
      sh.update();
    }),
    'del-consent-photo': (el) => {
      const arr = d.consents[el.dataset.k].photos;
      const [id] = arr.splice(Number(el.dataset.i), 1);
      if (newPhotos.includes(id)) PhotoDB.del(id); else removed.push(id);
      sh.update();
    },
  };
}

// ── Карта клиента: новая и изменение ──
function openClientForm({ clientId = null, prefill = '' } = {}) {
  const src = clientId ? IDX.client.get(clientId) : null;
  const d = src ? deepClone(src) : {
    id: null, cardNo: S.settings.nextCardNo, lastName: '', firstName: '', middleName: '', phone: '',
    contact: { kind: 'vk', handle: '' }, birth: '', source: '', tags: [], facePhoto: '', notes: '',
    consents: emptyConsents(), health: null, reminded: {}, createdAt: todayISO(),
  };
  d.consents = normalizeConsents(d.consents);
  d.contact = d.contact || { kind: 'phone', handle: '' };
  if (!src && prefill) {
    if (/^[\d\s()+\-]+$/.test(prefill)) d.phone = prefill.trim();
    else {
      const [a, b] = prefill.trim().split(/\s+/);
      d.firstName = cap(a || '');
      d.lastName = cap(b || '');
    }
  }
  if (src) d.phone = fmtPhone(d.phone);
  const newPhotos = [];
  const removed = [];
  const sh = openSheet({
    errors: {},
    render: (s) => clientFormHtml(d, s),
    onInput(path, v) {
      setPath(d, path, v);
      if (path === 'phone') { const box = $('#dup-box', this.el); if (box) box.innerHTML = dupHtml(d); }
    },
    onChange(path, v) { setPath(d, path, v); },
    onCancel(s) { newPhotos.forEach((id) => PhotoDB.del(id)); s.close('cancel'); },
    actions: {
      'contact-kind': (el) => { d.contact.kind = el.dataset.v; sh.update(); },
      source: (el) => { d.source = d.source === el.dataset.v ? '' : el.dataset.v; sh.update(); },
      tag: (el) => {
        const t = el.dataset.v;
        d.tags = d.tags.includes(t) ? d.tags.filter((x) => x !== t) : d.tags.concat(t);
        sh.update();
      },
      'add-face': () => pickPhotos((ids) => { d.facePhoto = ids[0]; newPhotos.push(ids[0]); sh.update(); }, false),
      'del-face': () => {
        if (newPhotos.includes(d.facePhoto)) PhotoDB.del(d.facePhoto); else removed.push(d.facePhoto);
        d.facePhoto = '';
        sh.update();
      },
      'open-dup': (el) => { newPhotos.forEach((id) => PhotoDB.del(id)); sh.close('cancel'); go(`/client/${el.dataset.id}`); },
      save: () => save(false),
      'save-proc': () => save(true),
    },
  });
  Object.assign(sh.actions, consentActions(d, sh, newPhotos, removed));

  async function save(startProc) {
    const errors = {};
    if (!String(d.firstName).trim()) errors.firstName = 'Укажите имя';
    const phone = normPhone(d.phone);
    if (!phone || phone.length !== 12) errors.phone = 'Нужен номер из 11 цифр';
    const no = parseInt(String(d.cardNo).replace(/\D/g, ''), 10);
    if (!no || no < 1) errors.cardNo = 'Номер карты — целое число';
    else if (S.clients.some((x) => x.cardNo === no && x.id !== d.id)) errors.cardNo = `Карта № ${no} уже есть`;
    if (d.birth && d.birth > todayISO()) errors.birth = 'Дата рождения в будущем';
    sh.errors = errors;
    if (Object.keys(errors).length) {
      sh.update();
      scrollToError(sh);
      toast('Проверьте выделенные поля');
      return;
    }
    const dup = findByPhone(phone, d.id);
    if (dup && !src) {
      const ok = await confirmDialog({ title: 'Номер уже есть в базе', text: `${esc(fullName(dup))}, карта № ${dup.cardNo}. Всё равно создать ещё одну карту?`, ok: 'Создать', danger: false });
      if (!ok) return;
    }
    const rec = {
      ...d,
      phone,
      cardNo: no,
      firstName: cap(String(d.firstName).trim()),
      lastName: cap(String(d.lastName).trim()),
      middleName: cap(String(d.middleName || '').trim()),
      notes: String(d.notes || '').trim(),
      contact: { kind: d.contact.kind, handle: d.contact.kind === 'phone' || d.contact.kind === 'wa' ? '' : String(d.contact.handle || '').trim() },
    };
    if (src) Object.assign(src, rec);
    else { rec.id = uid('c'); S.clients.push(rec); }
    S.settings.nextCardNo = Math.max(S.settings.nextCardNo, no + 1);
    removed.forEach((id) => PhotoDB.del(id));
    saveState();
    sh.close('ok');
    if (src) { toast('Данные сохранены'); render(); }
    else {
      toast(`Карта № ${no} создана`);
      go(`/client/${rec.id}`);
    }
    if (startProc) setTimeout(() => openProcForm({ clientId: rec.id }), 320);
  }
}

// ── Согласия (из карты) ──
function openConsentsForm(clientId, onDone) {
  const c = IDX.client.get(clientId);

function openHealthForm(clientId, onDone) {
  const c = IDX.client.get(clientId);
  const h = c.health ? deepClone(c.health) : { filledAt: '', flags: {}, allergies: [], meds: '', other: '' };
  h.flags = h.flags || {};
  h.allergies = h.allergies || [];
  const d = { h, consent: (c.consents && c.consents.health && c.consents.health.date) || '', allergyInput: '' };
  const sh = openSheet({
    render: () => `${sheetHead('Анкета здоровья', { right: 'Готово', rightAct: 'save' })}
      <div class="sheet-scroll">
        <div class="sheet-client">${avatarHtml(c, 'avatar--sm')}<div><div class="t">${esc(fullName(c))}</div><div class="s">Карта № ${c.cardNo}${h.filledAt ? ` · заполнена ${esc(fmtDate(h.filledAt, true))}` : ''}</div></div></div>
        <div class="warn-box" style="margin-bottom:6px"><div class="warn">${icon('shield', 'i-sm')}<div>Это данные о здоровье. Для них нужно отдельное письменное согласие клиентки. В списках и таблицах они не показываются.</div></div></div>
        <div class="form-title">Отметки</div>
        <div class="form-card" style="padding:2px 14px">${HEALTH_FLAGS.map((f) => `<label class="check"><input type="checkbox" data-bind="h.flags.${f.id}" ${h.flags[f.id] ? 'checked' : ''}><span>${esc(f.label)}</span></label>`).join('')}</div>
        <div class="form-title">Аллергии</div>
        <div class="chips" style="margin-bottom:10px">${h.allergies.length ? h.allergies.map((a, i) => `<button type="button" class="chip on" data-act="del-allergy" data-i="${i}" aria-label="Убрать: ${esc(a)}">${esc(a)} ${icon('close', 'i-sm')}</button>`).join('') : '<span class="muted" style="font-size:14px">Не отмечены</span>'}</div>
        <div class="inline-actions" style="margin-bottom:10px"><input class="input" data-bind="allergyInput" id="allergy-input" placeholder="Вещество или материал" value="${esc(d.allergyInput)}" autocomplete="off" aria-label="Новая аллергия"><button type="button" class="btn btn-secondary" data-act="add-allergy">Добавить</button></div>
        <div class="chips">${ALLERGY_SUGGEST.filter((a) => !h.allergies.includes(a)).map((a) => chip(`+ ${a}`, false, `data-act="add-allergy-s" data-v="${esc(a)}"`)).join('')}</div>
        <div class="form-title">Принимает препараты</div>
        <textarea class="textarea" data-bind="h.meds" placeholder="Какие и как давно">${esc(h.meds)}</textarea>
        <div class="form-title">Другое</div>
        <textarea class="textarea" data-bind="h.other" placeholder="Что важно знать перед процедурой">${esc(h.other)}</textarea>
        <div class="form-title">Согласие на обработку данных о здоровье</div>
        <div class="inline-actions"><input class="input" type="date" data-bind="consent" value="${esc(d.consent)}" max="${todayISO()}" aria-label="Дата согласия"><button type="button" class="btn btn-secondary" data-act="consent-today">Сегодня</button></div>
      </div>
      <div class="sheet-foot"><button class="btn btn-primary" data-act="save">Сохранить анкету</button></div>`,
    onInput(path, v) { setPath(d, path, v); },
    onChange(path, v) { setPath(d, path, v); },
    actions: {
      'add-allergy': () => {
        const v = norm(d.allergyInput);
        if (v && !h.allergies.includes(v)) h.allergies.push(v);
        d.allergyInput = '';
        sh.update();
      },
      'add-allergy-s': (el) => {
        if (!h.allergies.includes(el.dataset.v)) h.allergies.push(el.dataset.v);
        sh.update();
      },
      'del-allergy': (el) => { h.allergies.splice(Number(el.dataset.i), 1); sh.update(); },
      'consent-today': () => { d.consent = todayISO(); sh.update(); },
      save: () => {
        const extra = norm(d.allergyInput);
        if (extra && !h.allergies.includes(extra)) h.allergies.push(extra);
        h.filledAt = todayISO();
        h.meds = String(h.meds || '').trim();
        h.other = String(h.other || '').trim();

        if (onDone) onDone(); else render();
      },
    },
  });
}

// ── Процедура ──
function serviceOptions(d) {
  const list = S.services.filter((s) => s.active || s.id === d.serviceId);
  const opt = (s) => ({ value: s.id, label: `${s.name} · ${fmtMoney(s.price)}` });
  const groups = [];
  for (const z of S.zones) {
    const items = list.filter((s) => s.zones.length === 1 && s.zones[0] === z.id);
    if (items.length) groups.push({ group: z.name, items: items.map(opt) });
  }
  const multi = list.filter((s) => s.zones.length !== 1);
  if (multi.length) groups.push({ group: 'Для нескольких зон', items: multi.map(opt) });
  return groups;
}
function anestOptions(stage, current) {
  return S.anesthetics.filter((a) => a.stage === stage && (a.active || a.id === current)).map((a) => ({ value: a.id, label: a.name }));
}
function pigmentOptions(d, current) {
  const removal = d.type === 'removal';
  const all = S.pigments.filter((p) => (p.active || p.id === current) && (removal ? p.kind === 'Ремувер' : p.kind !== 'Ремувер'));
  const opt = (p) => ({ value: p.id, label: `${p.name} (${p.brand})` });
  const forZone = all.filter((p) => !d.zone || p.zones.includes(d.zone));
  const others = all.filter((p) => d.zone && !p.zones.includes(d.zone));
  const groups = [];
  if (forZone.length) groups.push({ group: d.zone ? `Для зоны «${zoneName(d.zone)}»` : 'Пигменты', items: forZone.map(opt) });
  if (others.length) groups.push({ group: 'Остальные', items: others.map(opt) });
  return groups;
}

function applyService(d) {
  const svc = IDX.service.get(d.serviceId);
  if (!svc) return;
  d.type = svc.type;
  if (svc.zones.length === 1) d.zone = svc.zones[0];
  else if (!svc.zones.includes(d.zone)) d.zone = '';
  applyZoneDefaults(d, svc);
  d.price = svc.price;
}
function applyZoneDefaults(d, svc) {
  const zd = IDX.zone.get(d.zone);
  if (d.type === 'removal') {
    d.technique = '';
    d.pigments = d.pigments.filter((g) => IDX.pigment.get(g.pigmentId) && IDX.pigment.get(g.pigmentId).kind === 'Ремувер');
    if (!d.pigments.length) {
      const rem = S.pigments.find((p) => p.active && p.kind === 'Ремувер');
      if (rem) d.pigments = [{ pigmentId: rem.id, lot: defaultLot(rem.id, d.date), ratio: '' }];
    }
  } else {
    d.pigments = d.pigments.filter((g) => !IDX.pigment.get(g.pigmentId) || IDX.pigment.get(g.pigmentId).kind !== 'Ремувер');
    if (svc && svc.technique) d.technique = svc.technique;
    else if (zd && !zd.techniques.includes(d.technique)) d.technique = '';
    if (!d.technique && d.zone) {
      const last = lastInZone(d.clientId, d.zone, d.id);
      if (last && last.technique && zd && zd.techniques.includes(last.technique)) d.technique = last.technique;
    }
  }
  syncPrevHealing(d);
}
function pickServiceFor(d) {
  const cur = IDX.service.get(d.serviceId);
  if (cur && cur.type === d.type && cur.zones.includes(d.zone)) return;
  const s = d.zone ? findService(d.zone, d.type) : null;
  if (s) { d.serviceId = s.id; d.price = s.price; } else if (cur && (!cur.zones.includes(d.zone) || cur.type !== d.type)) d.serviceId = '';
}

function openProcForm({ clientId = null, procId = null, draft = null } = {}) {
  const orig = procId ? IDX.proc.get(procId) : null;
  const c = IDX.client.get(clientId || (orig && orig.clientId));
  if (!c) return;
  const d = draft || (orig ? draftFromProc(orig) : newProcDraft(c.id));
  d.photos = d.photos || { before: [], after: [], month: [] };
  const initial = JSON.stringify(d);
  const newPhotos = [];
  const removedPhotos = [];
  const refreshTotal = (s) => {
    const tv = $('#total-val', s.el);
    const ts = $('#total-sub', s.el);
    if (tv) tv.textContent = fmtMoney(totalOf({ price: parseMoney(d.price), discount: d.discount }));
    if (ts) ts.textContent = totalSub(d);
    const ch = $('#cert-hint', s.el);
    const cert = IDX.cert.get(d.certificateId);
    if (ch && cert) ch.textContent = certPayText(cert, totalOf({ price: parseMoney(d.price), discount: d.discount }));
  };
  const sh = openSheet({
    d, c, errors: {},
    render: (s) => procFormHtml(s),
    onInput(path, v) {
      if (path === 'price') { d.price = parseMoney(v); refreshTotal(this); return; }
      if (path === 'discount.value') { d.discount.value = parseMoney(v); refreshTotal(this); return; }
      setPath(d, path, v);
    },
    onChange(path, v) {
      if (path === 'price' || path === 'discount.value') return;
      setPath(d, path, v);
      if (path === 'serviceId') applyService(d);
      else if (/^pigments\.\d+\.pigmentId$/.test(path)) {
        const i = Number(path.split('.')[1]);
        d.pigments[i].lot = defaultLot(v, d.date);
      } else if (path === 'date') syncPrevHealing(d);
      else if (path === 'model.on' && v && !d.discount.reason) {
        d.discount.reason = 'Модель';
        if (!d.model.courseId && S.courses.length) d.model.courseId = S.courses[S.courses.length - 1].id;
      }
      if (/\.ratio$|^note$|\.note$/.test(path)) return;
      this.update();
    },
    onCancel: async (s) => {
      if (JSON.stringify(d) !== initial) {
        const ok = await confirmDialog({ title: 'Закрыть без сохранения?', text: 'Введённые данные не сохранятся.', ok: 'Закрыть', cancel: 'Остаться' });
        if (!ok) return;
      }
      newPhotos.forEach((id) => PhotoDB.del(id));
      s.close('cancel');
    },
    actions: {
      type: (el) => { d.type = el.dataset.v; pickServiceFor(d); applyZoneDefaults(d, IDX.service.get(d.serviceId)); sh.update(); },
      zone: (el) => { d.zone = el.dataset.v; pickServiceFor(d); applyZoneDefaults(d, IDX.service.get(d.serviceId)); sh.update(); },
      tech: (el) => { d.technique = d.technique === el.dataset.v ? '' : el.dataset.v; sh.update(); },
      needle: (el) => {
        const id = el.dataset.v;
        d.needles = d.needles.includes(id) ? d.needles.filter((x) => x !== id) : d.needles.concat(id);
        sh.update();
      },
      'pg-add': () => {
        if (d.type === 'removal') {
          const rem = S.pigments.find((p) => p.active && p.kind === 'Ремувер');
          d.pigments.push({ pigmentId: rem ? rem.id : '', lot: rem ? defaultLot(rem.id, d.date) : '', ratio: '' });
        } else d.pigments.push({ pigmentId: '', lot: '', ratio: '' });
        sh.update();
      },
      'pg-del': (el) => { d.pigments.splice(Number(el.dataset.i), 1); sh.update(); },
      'photo-add': (el) => {
        const st = el.dataset.stage;
        pickPhotos((ids) => { d.photos[st] = (d.photos[st] || []).concat(ids); newPhotos.push(...ids); sh.update(); });
      },
      'photo-del': (el) => {
        const [id] = d.photos[el.dataset.stage].splice(Number(el.dataset.i), 1);
        if (newPhotos.includes(id)) PhotoDB.del(id); else removedPhotos.push(id);
        sh.update();
      },
      'view-draft-photo': (el) => {
        const items = [];
        let start = 0;
        for (const st of PHOTO_STAGES) {
          (d.photos[st.id] || []).forEach((id, i) => {
            if (st.id === el.dataset.stage && i === Number(el.dataset.i)) start = items.length;
            items.push({ src: photoSrc(id), title: st.label, sub: fmtDate(d.date, true) });
          });
        }
        openViewer(items, start);
      },
      'disc-mode': (el) => { d.discount.mode = el.dataset.v; sh.update(); },
      'disc-reason': (el) => { d.discount.reason = d.discount.reason === el.dataset.v ? '' : el.dataset.v; sh.update(); },
      payment: (el) => { d.payment = el.dataset.v; if (d.payment !== 'cert') d.certificateId = ''; sh.update(); },
      status: (el) => { d.status = el.dataset.v; sh.update(); },
      'prev-healing': (el) => { d.prevHealing.status = d.prevHealing.status === el.dataset.v ? '' : el.dataset.v; sh.update(); },
      'own-healing': (el) => { d.healing.status = d.healing.status === el.dataset.v ? '' : el.dataset.v; sh.update(); },
      'quick-fill': (el) => {
        const base = IDX.proc.get(el.dataset.id);
        const nd = repeatDraft(c.id, base.zone, base.id);
        for (const k of Object.keys(nd)) {
          if (!['id', 'clientId', 'date', 'photos', 'note', 'status', 'payment', 'certificateId', 'discount', 'model'].includes(k)) d[k] = nd[k];
        }
        syncPrevHealing(d);
        sh.update();
        toast(`Заполнено по процедуре от ${fmtDate(base.date, true)}`);
      },
      'open-health': () => openHealthForm(c.id, () => sh.update()),
      'open-consents': () => openConsentsForm(c.id, () => sh.update()),
      save: () => saveProc(false),
      'save-next': () => saveProc(true),
    },
  });

  async function saveProc(andNext) {
    const e = {};
    const price = parseMoney(d.price);
    if (!isISO(d.date)) e.date = 'Укажите дату';
    if (!d.serviceId) e.service = 'Выберите услугу';
    if (!d.zone) e.zone = 'Выберите зону';
    if (d.discount.mode === 'pct' && d.discount.value > 100) e.discount = 'Скидка больше 100 %';
    if (d.discount.mode === 'rub' && d.discount.value > price) e.discount = 'Скидка больше стоимости';
    if (d.payment === 'cert' && d.status === 'done' && !d.certificateId && availableCerts(d).length) e.cert = 'Выберите сертификат';
    sh.errors = e;
    if (Object.keys(e).length) {
      sh.update();
      scrollToError(sh);
      toast('Проверьте выделенные поля');
      return;
    }
    const dangers = procWarnings(d).filter((w) => w.level === 'danger');
    if (dangers.length) {
      const ok = await confirmDialog({ title: 'Проверьте перед сохранением', text: dangers.map((w) => esc(w.text)).join('<br><br>'), ok: 'Сохранить', cancel: 'Вернуться', danger: false });
      if (!ok) return;
    }
    const isNew = !d.id;
    const rec = {
      id: d.id || uid('p'),
      clientId: d.clientId,
      date: d.date,
      serviceId: d.serviceId,
      type: d.type,
      zone: d.zone,
      technique: d.type === 'removal' ? '' : d.technique,
      anesthesia: { primary: d.anesthesia.primary || '', secondary: d.anesthesia.secondary || '' },
      pigments: d.pigments.filter((g) => g.pigmentId).map((g) => ({ pigmentId: g.pigmentId, lot: g.lot || '', ratio: String(g.ratio || '').trim() })),
      needles: d.needles.slice(),
      photos: deepClone(d.photos),
      healing: { status: d.healing.status || '', note: String(d.healing.note || '').trim() },
      note: String(d.note || '').trim(),
      price,
      discount: { mode: d.discount.mode, value: Number(d.discount.value) || 0, reason: d.discount.value ? d.discount.reason : '' },
      payment: d.payment,
      certificateId: d.payment === 'cert' ? d.certificateId : '',
      status: d.status,
      model: d.model.on ? { on: true, courseId: d.model.courseId || '' } : { on: false, courseId: '' },
      createdAt: orig ? orig.createdAt : new Date().toISOString(),
    };
    if (orig) Object.assign(orig, rec); else S.procedures.push(rec);
    for (const cert of S.certificates) {
      if (cert.usedProcId === rec.id && (cert.id !== rec.certificateId || rec.status !== 'done')) { cert.usedProcId = ''; cert.usedAt = ''; }
    }
    if (rec.certificateId && rec.status === 'done') {
      const cert = S.certificates.find((x) => x.id === rec.certificateId);
      if (cert) { cert.usedProcId = rec.id; cert.usedAt = rec.date; }
    }
    if (d.prevHealing) {
      const t = S.procedures.find((p) => p.id === d.prevHealing.procId);
      if (t) t.healing = { status: d.prevHealing.status || '', note: String(d.prevHealing.note || '').trim() };
    }
    if (rec.model.on && !(c.tags || []).includes('Модель')) c.tags = (c.tags || []).concat('Модель');
    removedPhotos.forEach((id) => PhotoDB.del(id));
    saveState();
    sh.close('ok');
    let msg = 'Процедура сохранена';
    if (isNew && rec.status === 'done' && (rec.type === 'primary' || rec.type === 'cover')) {
      msg = `Сохранено. Окно коррекции: ${fmtDateShort(addDays(rec.date, S.settings.corrFrom))} – ${fmtDateShort(addDays(rec.date, S.settings.corrTo))}`;
    }
    toast(msg);
    render();
    if (andNext) setTimeout(() => openProcForm({ clientId: rec.clientId, draft: newProcDraft(rec.clientId, rec.date) }), 320);
  }
}

// ── Сообщение по шаблону ──
function openMessage(c, kindIn, keyIn) {
  const inf = clientInfo(c);
  let kind = kindIn;
  if (!kind) kind = inf.corr.length ? 'corr' : inf.upd.length ? 'upd' : inf.bday && inf.bday.inDays <= 14 ? 'bday' : inf.lost ? 'lost' : 'free';
  const st = { kind, it: null, key: '', text: '', mark: true };
  const itemFor = (k) => {
    if (k === 'corr') return inf.corr.find((x) => x.key === keyIn) || inf.corr[0] || null;
    if (k === 'upd') return inf.upd.find((x) => x.key === keyIn) || inf.upd[0] || null;
    if (k === 'lost' && inf.last) return { kind: 'lost', zone: inf.last.zone, proc: inf.last, key: `lost:${inf.last.id}` };
    if (k === 'bday' && inf.bday) return { kind: 'bday', key: inf.bday.key };
    return null;
  };
  const fill = () => {
    st.it = itemFor(st.kind);
    st.key = st.it ? st.it.key : '';
    st.text = fillTemplate(S.settings.templates[st.kind], c, st.it);
  };
  fill();
  const kindCh = c.contact && c.contact.kind !== 'phone' ? c.contact.kind : 'sms';
  const channel = kindCh === 'sms' ? 'СМС' : CONTACT_LABEL[kindCh];
  const sh = openSheet({
    render: () => `${sheetHead('Сообщение', { left: 'Закрыть' })}
      <div class="sheet-scroll">
        <div class="sheet-client">${avatarHtml(c, 'avatar--sm')}<div><div class="t">${esc(fullName(c))}</div><div class="s">${esc(channel)}${c.contact && c.contact.handle ? `: ${esc(c.contact.handle)}` : ''} · ${esc(fmtPhone(c.phone))}</div></div></div>
        <div class="form-title" style="margin-top:0">Шаблон</div>
        <div class="chips" style="margin-bottom:14px">${TEMPLATE_DEFS.map((t) => chip(t.label, st.kind === t.id, `data-act="tpl" data-v="${t.id}"`)).join('')}</div>
        <textarea class="textarea" data-bind="text" style="min-height:150px" aria-label="Текст сообщения">${esc(st.text)}</textarea>
        ${st.key ? `<label class="check" style="border:0"><input type="checkbox" data-bind="mark" ${st.mark ? 'checked' : ''}><span>Отметить «напомнили». Клиентка уйдёт вниз списка на две недели</span></label>` : ''}
        <p class="hint" style="margin-top:6px">Приложение не отправляет сообщения само: текст копируется, мастер вставляет его в ${esc(channel)} и отправляет вручную. Шаблоны меняются в настройках.</p>
      </div>
      <div class="sheet-foot"><button class="btn btn-secondary" data-act="copy">${icon('copy')} Скопировать</button><button class="btn btn-primary" data-act="open-chat">Открыть ${esc(channel)}</button></div>`,
    onInput(path, v) { st[path] = v; },
    onChange(path, v) { st[path] = v; },
    actions: {
      tpl: (el) => { st.kind = el.dataset.v; fill(); sh.update(); },
      copy: async () => {
        if (await copyText(st.text)) finish('Текст скопирован');
        else copyFailed();
      },
      'open-chat': async () => {
        if (await copyText(st.text)) finish(`Текст скопирован. Здесь откроется ${channel}, в заглушке ник выдуманный`);
        else copyFailed();
      },
    },
  });
  function copyFailed() {
    const ta = $('[data-bind="text"]', sh.el);
    if (ta) { ta.focus(); ta.select(); }
    toast('Браузер не дал скопировать. Текст выделен, скопируйте его вручную');
  }
  function finish(msg) {
    if (st.mark && st.key) { markReminded(c, st.key); saveState(); }
    sh.close('ok');
    toast(msg);
    render();
  }
}

// ── 10-refs.js
// «Справочники»: прайс, пигменты с партиями, иглы, анестезия, зоны и техники, курсы обучения.

const REF_KINDS = [
  { id: 'services', label: 'Услуги' },
  { id: 'pigments', label: 'Пигменты' },
  { id: 'needles', label: 'Иглы' },
  { id: 'anesthetics', label: 'Анестезия' },
  { id: 'zones', label: 'Зоны' },
  { id: 'courses', label: 'Курсы' },
];
const REF_COLL = { services: 'services', pigments: 'pigments', needles: 'needles', anesthetics: 'anesthetics', zones: 'zones', courses: 'courses' };

route((p) => p[0] === 'refs', screenRefs, { tab: 'refs' });

function usageCount(kind, id) {
  if (kind === 'services') return S.procedures.filter((p) => p.serviceId === id).length;
  if (kind === 'pigments') return S.procedures.filter((p) => p.pigments.some((g) => g.pigmentId === id)).length;
  if (kind === 'needles') return S.procedures.filter((p) => p.needles.includes(id)).length;
  if (kind === 'anesthetics') return S.procedures.filter((p) => p.anesthesia.primary === id || p.anesthesia.secondary === id).length;
  if (kind === 'zones') return S.procedures.filter((p) => p.zone === id).length + S.services.filter((s) => s.zones.includes(id)).length;
  if (kind === 'courses') return S.procedures.filter((p) => p.model && p.model.courseId === id).length;
  return 0;
}

function screenRefs(r) {
  const kind = REF_KINDS.some((k) => k.id === r.parts[1]) ? r.parts[1] : UI.refsKind;
  UI.refsKind = kind;
  const body = { services: refServices, pigments: refPigments, needles: refNeedles, anesthetics: refAnesthetics, zones: refZones, courses: refCourses }[kind]();
  return `<div class="screen">
    <header class="topbar">
      <div class="topbar-row"><h1 class="display title-lg">Справочники</h1></div>
      <div class="seg seg--scroll" role="tablist">${REF_KINDS.map((k) => `<button role="tab" class="${k.id === kind ? 'on' : ''}" aria-selected="${k.id === kind}" data-act="refs-kind" data-id="${k.id}">${k.label}</button>`).join('')}</div>
    </header>
    <div class="scroller">${body}</div>
    <button class="fab" data-act="ref-new" data-kind="${kind}" aria-label="Добавить">${icon('plus')}</button>
  </div>`;
}

const refRow = (kind, x, title, sub, side = '') => `<button class="row ${x.active === false ? 'row--dim' : ''}" data-act="ref-edit" data-kind="${kind}" data-id="${x.id}"><div class="row-main"><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div>${side ? `<div class="row-side">${side}</div>` : ''}</button>`;

function refServices() {
  const row = (s) => refRow('services', s, esc(s.name), esc(`${TYPE_LABEL[s.type]} · ${s.duration} мин${s.active ? '' : ' · в архиве'}`), `<span class="num" style="font-weight:600">${fmtMoney(s.price)}</span>`);
  const groups = S.zones.map((z) => ({ title: z.name, items: S.services.filter((s) => s.zones.length === 1 && s.zones[0] === z.id) })).filter((g) => g.items.length);
  const multi = S.services.filter((s) => s.zones.length !== 1);
  if (multi.length) groups.push({ title: 'Для нескольких зон', items: multi });
  return `<p class="note" style="margin:4px 4px 0">Цены условные, это заглушка. Цена услуги подставляется в процедуру сама, её можно изменить.</p>${groups.map((g) => `<div class="section-title">${esc(g.title)}</div><div class="list list--plain">${g.items.map(row).join('')}</div>`).join('')}`;
}

function refPigments() {
  const T = IDX.today;
  const brands = uniq(S.pigments.map((p) => p.brand));
  const row = (p) => {
    const expired = p.lots.filter((l) => l.exp && l.exp < T);
    const cur = p.lots.find((l) => !l.exp || l.exp >= T);
    const sub = `${p.kind} · ${p.zones.map((z) => lc(zoneName(z))).join(', ')}`;
    const lotLine = [
      cur ? `партия ${esc(cur.no)}${cur.exp ? ` до ${fmtMonthNum(cur.exp)}` : ''}` : 'нет действующей партии',
      expired.length ? `<span class="dot dot--alert"></span> просрочена ${expired.map((l) => esc(l.no)).join(', ')}` : '',
    ].filter(Boolean).join(' · ');
    const used = usageCount('pigments', p.id);
    const side = `<span class="muted" style="font-size:12px">${used ? pl(used, 'процедура', 'процедуры', 'процедур') : 'не использовался'}</span>`;
    return `<button class="row ${p.active ? '' : 'row--dim'}" data-act="ref-edit" data-kind="pigments" data-id="${p.id}"><span class="swatch" style="width:28px;height:28px;background:${esc(p.hex)}"></span><div class="row-main"><div class="row-title">${esc(p.name)}</div><div class="row-sub">${esc(sub)}</div><div class="row-sub2">${lotLine}</div></div><div class="row-side">${side}</div></button>`;
  };
  return `<p class="note" style="margin:4px 4px 0">Марки условные. У каждого пигмента — партии со сроком годности: в процедуре подставляется действующая партия, просроченную приложение подсветит.</p>${brands.map((b) => `<div class="section-title">${esc(b)}</div><div class="list list--plain">${S.pigments.filter((p) => p.brand === b).map(row).join('')}</div>`).join('')}`;

function openRefForm(kind, id) {
  const coll = S[REF_COLL[kind]];
  const src = id ? coll.find((x) => x.id === id) : null;
  const d = src ? deepClone(src) : blankRef(kind);
  if (kind === 'anesthetics') d.substancesText = d.substances.join(', ');
  if (kind === 'zones') d.techniquesText = d.techniques.join(', ');
  const used = src ? usageCount(kind, src.id) : 0;
  const sh = openSheet({
    errors: {},
    render: (s) => `${sheetHead(src ? REF_TITLES[kind][1] : REF_TITLES[kind][0], { right: 'Готово', rightAct: 'save' })}
      <div class="sheet-scroll">${refFormBody(kind, d, s.errors || {})}
        ${src ? `<p class="hint" style="margin-top:14px">${used ? `Используется: ${used}. Удалить нельзя, только убрать из выбора — история процедур не пострадает.` : 'Пока нигде не используется, можно удалить.'}</p>${!used ? '<button type="button" class="btn btn-danger btn-block" data-act="ref-del">Удалить</button>' : ''}` : ''}
      </div>
      <div class="sheet-foot"><button class="btn btn-primary" data-act="save">Сохранить</button></div>`,
    onInput(path, v) {
      if (path === 'price' || path === 'duration') { d[path] = parseMoney(v); return; }
      setPath(d, path, v);
    },
    onChange(path, v) {
      if (path === 'price' || path === 'duration') return;
      setPath(d, path, v);
      if (/^lots\.\d+\.exp$/.test(path) || path === 'hex') sh.update();
    },
    actions: {
      'ref-zone': (el) => {
        const z = el.dataset.v;
        d.zones = d.zones.includes(z) ? d.zones.filter((x) => x !== z) : d.zones.concat(z);
        if (kind === 'services' && d.zones.length !== 1) d.technique = '';
        sh.update();
      },
      'ref-type': (el) => { d.type = el.dataset.v; sh.update(); },
      'ref-tech': (el) => { d.technique = d.technique === el.dataset.v ? '' : el.dataset.v; sh.update(); },
      'ref-pkind': (el) => { d.kind = el.dataset.v; sh.update(); },
      'ref-stage': (el) => { d.stage = el.dataset.v; sh.update(); },
      'ref-group': (el) => { d.group = el.dataset.v; sh.update(); },
      'lot-add': () => { d.lots.unshift({ no: '', exp: addMonths(todayISO(), 12) }); sh.update(); },
      'lot-del': (el) => { d.lots.splice(Number(el.dataset.i), 1); sh.update(); },
      'ref-del': async () => {
        const ok = await confirmDialog({ title: 'Удалить из справочника?', text: esc(d.name || 'Без названия') });
        if (!ok) return;
        S[REF_COLL[kind]] = coll.filter((x) => x.id !== src.id);
        saveState();
        sh.close('ok');
        render();
        toast('Удалено');
      },
      save: () => {
        const e = {};
        if (!String(d.name || '').trim()) e.name = 'Укажите название';
        if (kind === 'services' && !d.zones.length) e.zones = 'Выберите хотя бы одну зону';
        if (kind === 'pigments' && !String(d.brand || '').trim()) e.brand = 'Укажите марку';
        sh.errors = e;
        if (Object.keys(e).length) { sh.update(); scrollToError(sh); return; }
        const rec = { ...d, name: String(d.name).trim() };
        if (kind === 'anesthetics') { rec.substances = String(d.substancesText || '').split(',').map(norm).filter(Boolean); delete rec.substancesText; }
        if (kind === 'zones') { rec.techniques = uniq(String(d.techniquesText || '').split(',').map((t) => cap(t.trim())).filter(Boolean)); delete rec.techniquesText; }
        if (kind === 'pigments') { rec.brand = String(d.brand).trim(); rec.lots = d.lots.filter((l) => String(l.no).trim()).map((l) => ({ no: String(l.no).trim(), exp: l.exp || '' })); }
        if (src) Object.assign(src, rec); else coll.push(rec);
        saveState();
        sh.close('ok');
        render();
        toast(src ? 'Сохранено' : 'Добавлено в справочник');
      },
    },
  });
}

// ── Отчёты ──
function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  const n = v / p;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * p;
}

function columnChart(series, selYm) {
  const W = 340;
  const H = 176;
  const L = 36;
  const R = 4;
  const T = 18;
  const B = 22;
  const top = niceMax(Math.max(...series.map((s) => s.revenue), 1));
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const band = (W - L - R) / series.length;
  const bw = Math.min(16, band * 0.6);
  let g = '';
  for (const t of [0, top / 2, top]) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${t ? esc(fmtMoneyShort(t)) : '0'}</text>`;
  }
  let bars = '';
  series.forEach((s, i) => {
    const x = L + band * i + (band - bw) / 2;
    const cx = x + bw / 2;
    const base = y(0);
    const tp = y(s.revenue);
    const h = base - tp;
    const sel = selYm ? s.ym === selYm : true;
    bars += `<rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${H - T - B}" data-i="${i}" tabindex="0" role="img" aria-label="${esc(`${MONTHS_NOM[parseISO(s.iso).getMonth()]} ${s.year}: ${fmtMoney(s.revenue)}`)}"/>`;
    if (h > 0.5) {
      const r = Math.min(4, bw / 2, h);
      bars += `<path class="col" style="fill:${sel ? 'var(--bar)' : 'var(--bar-muted)'};pointer-events:none" d="M${x.toFixed(1)} ${base.toFixed(1)}V${(tp + r).toFixed(1)}Q${x.toFixed(1)} ${tp.toFixed(1)} ${(x + r).toFixed(1)} ${tp.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)} ${tp.toFixed(1)} ${(x + bw).toFixed(1)} ${(tp + r).toFixed(1)}V${base.toFixed(1)}Z"/>`;
    }
    if (selYm && s.ym === selYm) bars += `<text class="val" x="${cx.toFixed(1)}" y="${(tp - 6).toFixed(1)}" text-anchor="middle">${esc(fmtMoneyShort(s.revenue))}</text>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(s.label)}</text>`;
  });
  return `<div class="chart" data-series="${esc(JSON.stringify(series))}"><svg viewBox="0 0 ${W} ${H}" aria-label="Выручка по месяцам">${g}${bars}</svg><div class="chart-tip" aria-hidden="true"></div></div>`;
}

function seriesTable(series) {
  return `<table class="chart-table"><thead><tr><th>Месяц</th><th>Процедур</th><th>Выручка</th><th>Расходники</th></tr></thead><tbody>${series.slice().reverse().map((s) => `<tr><td>${esc(`${cap(MONTHS_NOM[parseISO(s.iso).getMonth()])} ${s.year}`)}</td><td>${s.count}</td><td>${fmtMoney(s.revenue)}</td><td>${fmtMoney(s.expenses)}</td></tr>`).join('')}</tbody></table>`;
}

function bindChart() {
  const chart = $('.chart');
  if (!chart) return;
  const series = JSON.parse(chart.dataset.series);
  const tip = $('.chart-tip', chart);
  const card = chart.closest('.chart-card');
  const show = (el) => {
    const s = series[Number(el.dataset.i)];
    tip.innerHTML = `<b>${esc(fmtMoney(s.revenue))}</b>${esc(`${cap(MONTHS_NOM[parseISO(s.iso).getMonth()])} ${s.year} · ${pl(s.count, 'процедура', 'процедуры', 'процедур')}`)}<br>${esc(`расходники ${fmtMoney(s.expenses)}`)}`;
    tip.classList.add('show');
    const r = el.getBoundingClientRect();
    const cr = card.getBoundingClientRect();
    const left = clamp(r.left - cr.left + r.width / 2 - tip.offsetWidth / 2, 4, cr.width - tip.offsetWidth - 4);
    tip.style.left = `${left}px`;
    tip.style.top = '6px';
  };
  const hide = () => tip.classList.remove('show');
  for (const el of $$('.hit', chart)) {
    el.addEventListener('pointerenter', () => show(el));
    el.addEventListener('pointerdown', () => show(el));
    el.addEventListener('focus', () => show(el));
    el.addEventListener('pointerleave', hide);
    el.addEventListener('blur', hide);
  }
}

function hbarsCard(title, rows, empty = 'Нет данных за период') {
  const max = Math.max(1, ...rows.map((r) => r.value));
  const body = rows.length
    ? `<div class="hbars">${rows.map((r) => `<div class="hbar"><div class="hbar-top"><span>${esc(r.label)}</span><span class="num">${r.text}</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${((r.value / max) * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>`
    : `<div class="muted" style="font-size:14px">${esc(empty)}</div>`;
  return `<div class="section-title">${esc(title)}</div><div class="card">${body}</div>`;
}

function openCertForm(id) {
  const src = id ? S.certificates.find((x) => x.id === id) : null;

  const sh = openSheet({
    errors: {},
    render: (s) => {
      const e = s.errors || {};
      const st = src ? certStatus(src) : 'active';
      const p = src && src.usedProcId ? IDX.proc.get(src.usedProcId) : null;
      const c = p ? IDX.client.get(p.clientId) : null;
      return `${sheetHead(src ? `Сертификат № ${d.no}` : 'Новый сертификат', { right: 'Готово', rightAct: 'save' })}
      <div class="sheet-scroll">
        ${src ? `<div class="card card--mint" style="margin-bottom:12px"><div style="font-weight:600">${esc(CERT_STATUS_LABEL[st])}</div>${c ? `<div class="note">Процедура ${esc(fmtDate(p.date, true))} · ${esc(fullName(c))} · ${esc(serviceName(p.serviceId))}</div><button type="button" class="btn-link" data-act="cert-open-proc">Открыть процедуру</button>` : ''}</div>` : ''}
        <div class="form-card">
          ${field('Номер', `<input class="input" data-bind="no" value="${esc(d.no)}" autocomplete="off">`, e.no)}
          <div class="field"><span class="field-label">Номинал</span><div class="chips" style="margin-bottom:8px">${presets.map((v) => chip(fmtMoney(v), Number(d.amount) === v, `data-act="cert-amount" data-v="${v}"`)).join('')}</div><div class="affix"><input class="input" inputmode="numeric" data-bind="amount" value="${esc(d.amount)}" aria-label="Номинал"><span>₽</span></div>${e.amount ? errHtml(e.amount) : ''}</div>
          <div class="grid-2">${field('Продан', `<input class="input" type="date" data-bind="soldAt" value="${esc(d.soldAt)}">`)}${field('Действует до', `<input class="input" type="date" data-bind="validTo" value="${esc(d.validTo)}">`)}</div>
          ${field('Кто купил', `<input class="input" data-bind="buyer" value="${esc(d.buyer)}" autocomplete="off">`, '', 'необязательно')}
          ${field('Для кого', `<input class="input" data-bind="recipient" value="${esc(d.recipient)}" autocomplete="off">`, '', 'необязательно')}
          <div class="field"><span class="field-label">Оплата</span><div class="chips">${PAYMENTS.filter((pm) => pm.id !== 'cert').map((pm) => chip(pm.label, d.payment === pm.id, `data-act="cert-pay" data-v="${pm.id}"`)).join('')}</div></div>
          ${field('Примечание', `<textarea class="textarea" data-bind="note">${esc(d.note)}</textarea>`, '', 'необязательно')}
        </div>
        ${src && !src.usedProcId ? '<button type="button" class="btn btn-danger btn-block" style="margin-top:14px" data-act="cert-del">Удалить сертификат</button>' : ''}
      </div>
      <div class="sheet-foot"><button class="btn btn-primary" data-act="save">${src ? 'Сохранить' : 'Продать сертификат'}</button></div>`;
    },
    onInput(path, v) {
      if (path === 'amount') { d.amount = parseMoney(v); return; }
      setPath(d, path, v);
    },
    onChange(path, v) { if (path !== 'amount') setPath(d, path, v); },
    actions: {
      'cert-amount': (el) => { d.amount = Number(el.dataset.v); sh.update(); },
      'cert-pay': (el) => { d.payment = el.dataset.v; sh.update(); },
      'cert-open-proc': () => { sh.close('ok'); go(`/proc/${src.usedProcId}`); },
      'cert-del': async () => {
        const ok = await confirmDialog({ title: 'Удалить сертификат?', text: `№ ${esc(d.no)} на ${fmtMoney(d.amount)}` });
        if (!ok) return;
        S.certificates = S.certificates.filter((x) => x.id !== src.id);
        saveState();
        sh.close('ok');
        render();
        toast('Сертификат удалён');
      },
      save: () => {
        const e = {};
        if (!String(d.no).trim()) e.no = 'Укажите номер';
        else if (S.certificates.some((x) => x.no === String(d.no).trim() && x.id !== d.id)) e.no = 'Такой номер уже есть';
        if (!(Number(d.amount) > 0)) e.amount = 'Укажите номинал';
        sh.errors = e;
        if (Object.keys(e).length) { sh.update(); scrollToError(sh); return; }
        const rec = { ...d, no: String(d.no).trim(), amount: Number(d.amount), buyer: String(d.buyer || '').trim(), recipient: String(d.recipient || '').trim(), note: String(d.note || '').trim() };
        if (src) Object.assign(src, rec);
        else {
          S.certificates.push(rec);
          S.settings.nextCertNo += 1;
        }
        saveState();
        sh.close('ok');
        render();
        toast(src ? 'Сохранено' : `Сертификат № ${rec.no} продан`);
      },
    },
  });
}

ACTIONS['backup-restore'] = () => {
  const inp = $('#restore-input');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    let data;
    try {
      data = JSON.parse(await f.text());
    } catch (e) {
      toast('Не получилось прочитать файл');
      return;
    }
    if (!data || data.format !== 'ketsal-crm-backup' || !data.state || !Array.isArray(data.state.clients)) {
      toast('Это не резервная копия приложения');
      return;
    }
    const ok = await confirmDialog({
      title: 'Заменить все данные копией?',
      text: `Копия от ${esc(fmtDate(String(data.createdAt).slice(0, 10), true))}: ${pl(data.state.clients.length, 'карта', 'карты', 'карт')}, ${pl(data.state.procedures.length, 'процедура', 'процедуры', 'процедур')}. Текущие данные заменятся.`,
      ok: 'Заменить',
    });
    if (!ok) return;
    S = migrate(data.state);
    PhotoDB.clear();
    for (const [pid, url] of Object.entries(data.photos || {})) PhotoDB.put(pid, url);
    saveState();
    closeAllSheets();
    switchTab('clients');
    toast('Данные восстановлены из копии');
  };
  inp.click();
};

// ── Расходники: что купили, сколько стоило, когда ──
const EXP_PERIODS = [['month', 'Этот месяц'], ['prev', 'Прошлый месяц'], ['year', 'Этот год'], ['all', 'Все']];
function expRange(id) {
  const T = IDX.today;
  if (id === 'month') return [startOfMonth(T), endOfMonth(T)];
  if (id === 'prev') {
    const m = addMonths(startOfMonth(T), -1);
    return [m, endOfMonth(m)];
  }
  if (id === 'year') return [`${T.slice(0, 4)}-01-01`, `${T.slice(0, 4)}-12-31`];
  return ['0000-01-01', '9999-12-31'];
}

function screenExpenses() {
  const [a, b] = expRange(UI.expPeriod);
  const list = S.expenses.filter((e) => e.date >= a && e.date <= b).sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0));
  const groups = [];
  for (const e of list) {
    const ym = e.date.slice(0, 7);
    let g = groups[groups.length - 1];
    if (!g || g.ym !== ym) { g = { ym, items: [] }; groups.push(g); }
    g.items.push(e);
  }
  const row = (e) => `<button class="row" data-act="exp-edit" data-id="${e.id}"><div class="row-main"><div class="row-title">${esc(e.name || e.category)}</div><div class="row-sub">${esc([e.name ? e.category : '', fmtDate(e.date, true)].filter(Boolean).join(' · '))}</div></div><div class="row-side"><span class="num" style="font-weight:600">${fmtMoney(e.amount)}</span></div></button>`;
  const body = list.length
    ? groups.map((g) => `<div class="section-title"><span>${esc(fmtMonthYear(`${g.ym}-01`))}</span><span class="num">${fmtMoney(sum(g.items, (e) => e.amount))}</span></div><div class="list list--plain">${g.items.map(row).join('')}</div>`).join('')
    : `<div class="empty"><p>За этот период покупок нет</p><button class="btn btn-primary" data-act="exp-new">${icon('plus')} Добавить покупку</button></div>`;
  return `<div class="screen">
    ${navBar({ title: 'Расходники', backTo: '/more' })}
    <div class="scroller">
      <div class="chips" style="margin:6px 0 4px">${EXP_PERIODS.map(([id, l]) => chip(l, UI.expPeriod === id, `data-act="exp-period" data-v="${id}"`)).join('')}</div>
      <div class="card card--mint" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span style="font-weight:600">${pl(list.length, 'покупка', 'покупки', 'покупок')}</span><span style="font-size:22px;font-weight:600">${fmtMoney(sum(list, (e) => e.amount))}</span></div><div class="note" style="margin-top:2px">Итоги по категориям и «выручка минус расходники» — в отчётах</div></div>
      ${body}
    </div>
    <button class="fab" data-act="exp-new" aria-label="Добавить покупку">${icon('plus')}</button>
  </div>`;
}

function openExpenseForm(id) {
  const src = id ? S.expenses.find((x) => x.id === id) : null;
  const d = src ? deepClone(src) : { id: uid('ex'), category: S.lists.expenseCategories[0] || 'Другое', name: '', amount: 0, date: todayISO() };
  const sh = openSheet({
    errors: {},
    render: (s) => {
      const e = s.errors || {};

      <div class="sheet-scroll">
        <div class="form-card">
          <div class="field"><span class="field-label">Что купили</span><div class="chips">${S.lists.expenseCategories.map((c) => chip(c, d.category === c, `data-act="exp-cat" data-v="${esc(c)}"`)).join('')}</div></div>
          ${field('Описание', `<input class="input" data-bind="name" value="${esc(d.name)}" placeholder="например, картриджи 1RL 0,30 мм, 20 шт" autocomplete="off">`, '', 'необязательно')}
          <div class="grid-2">${field('Стоимость', `<div class="affix"><input class="input" inputmode="numeric" data-bind="amount" value="${d.amount ? esc(d.amount) : ''}" placeholder="0" autocomplete="off"><span>₽</span></div>`, e.amount)}${field('Дата покупки', `<input class="input" type="date" data-bind="date" value="${esc(d.date)}" max="${todayISO()}">`, e.date)}</div>
        </div>
        <p class="hint" style="margin-top:12px">Категории меняются в «Настройки → Списки вариантов».</p>
        ${src ? '<button type="button" class="btn btn-danger btn-block" style="margin-top:6px" data-act="exp-del">Удалить покупку</button>' : ''}
      </div>
      <div class="sheet-foot"><button class="btn btn-primary" data-act="save">Сохранить</button></div>`;
    },
    onInput(path, v) {
      if (path === 'amount') d.amount = parseMoney(v);
      else setPath(d, path, v);
    },
    onChange(path, v) { if (path !== 'amount') setPath(d, path, v); },
    actions: {
      'exp-cat': (el) => { d.category = el.dataset.v; sh.update(); },
      'exp-del': async () => {
        const ok = await confirmDialog({ title: 'Удалить покупку?', text: `${esc(d.name || d.category)}, ${fmtMoney(d.amount)}` });
        if (!ok) return;
        S.expenses = S.expenses.filter((x) => x.id !== src.id);
        saveState();
        sh.close('ok');
        render();
        toast('Покупка удалена');
      },
      save: () => {
        const e = {};
        if (!(d.amount > 0)) e.amount = 'Укажите стоимость';
        if (!isISO(d.date)) e.date = 'Укажите дату';
        sh.errors = e;
        if (Object.keys(e).length) { sh.update(); scrollToError(sh); return; }
        const rec = { ...d, name: String(d.name || '').trim() };
        if (src) Object.assign(src, rec); else S.expenses.push(rec);
        saveState();
        sh.close('ok');
        render();
        toast(src ? 'Сохранено' : 'Покупка добавлена');
      },
    },
  });
}

// ── 12-overlays.js
// Экран входа, первый запуск, просмотр фото, печать карты, сценарии для проверки, тема и автоблокировка.

// ── Тема ──
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

// ── Вход ──
const lockState = { pin: '', mode: 'pin', error: '' };
function showLock() {
  UI.locked = true;
  clearTimeout(idleTimer);
  lockState.pin = '';
  lockState.error = '';
  lockState.mode = S.settings.quickUnlock === 'password' ? 'password' : 'pin';
  renderLock();
  $('#lock').classList.add('show');
}
function renderLock() {
  const s = S.settings;
  const pin = lockState.mode === 'pin';
  $('#lock').innerHTML = `<div class="lock-bird">${ASSETS.bird}</div>
    <div class="lock-logo">${ASSETS.logo}</div>
    ${pin ? `
      <div class="lock-sub">Введите код</div>
      <div class="pin-dots" id="pin-dots" aria-live="polite" aria-label="Введено цифр: ${lockState.pin.length} из 6">${[0, 1, 2, 3, 4, 5].map((i) => `<i class="${i < lockState.pin.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="lock-hint" id="lock-hint">${esc(lockState.error || 'В заглушке подойдёт любой код из 6 цифр')}</div>
      <div class="keypad">
        ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((n) => `<button class="key" data-act="pin" data-v="${n}">${n}</button>`).join('')}
        ${s.quickUnlock === 'faceid' ? `<button class="key key--flat" data-act="faceid" aria-label="Войти по Face ID">${icon('faceid')}</button>` : '<span></span>'}
        <button class="key" data-act="pin" data-v="0">0</button>
        <button class="key key--flat" data-act="pin-del" aria-label="Стереть цифру">${icon('backspace')}</button>
      </div>
      <div class="lock-links"><button class="btn-link" data-act="lock-mode" data-v="password">Войти по мастер-паролю</button></div>`
    : `
      <div class="lock-sub">Введите мастер-пароль</div>
      <div class="lock-pass">
        <input class="input" type="password" id="lock-pass" placeholder="Мастер-пароль" autocomplete="current-password" aria-label="Мастер-пароль">
        <div class="lock-hint">${esc(lockState.error || 'В заглушке подойдёт любой пароль')}</div>
        <button class="btn btn-primary btn-block" data-act="unlock-pass">Войти</button>
        ${s.quickUnlock !== 'password' ? '<button class="btn btn-ghost btn-block" data-act="lock-mode" data-v="pin">Ввести код</button>' : ''}
      </div>`}`;
  if (!pin) setTimeout(() => { const i = $('#lock-pass'); if (i) i.focus(); }, 60);
}
function updatePinDots() {
  $$('#pin-dots i').forEach((d, i) => d.classList.toggle('on', i < lockState.pin.length));
}
function unlock() {
  UI.locked = false;
  $('#lock').classList.remove('show');
  $('#lock').innerHTML = '';
  resetIdle();
  render();
}
function pressPin(v) {
  if (lockState.pin.length >= 6) return;
  lockState.pin += v;
  lockState.error = '';
  updatePinDots();
  if (lockState.pin.length === 6) setTimeout(unlock, 160);
}
ACTIONS.pin = (el) => pressPin(el.dataset.v);
ACTIONS['pin-del'] = () => { lockState.pin = lockState.pin.slice(0, -1); updatePinDots(); };
ACTIONS.faceid = () => {
  const box = document.createElement('div');
  box.className = 'faceid-anim';
  box.innerHTML = `<div>${icon('faceid')}</div>`;
  $('#lock').appendChild(box);

let idleTimer = null;

  if (!m || UI.locked) return;
  idleTimer = setTimeout(showLock, m * 60000);
}
function bindIdle() {

    const now = Date.now();
    if (now - last < 1000) return;

    resetIdle();

  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((ev) => document.addEventListener(ev, poke, { passive: true }));
  document.addEventListener('visibilitychange', () => {

}

  if (viewer.mode === 'compare') {

    el.innerHTML = `<div class="viewer-top"><span style="width:44px"></span><span class="viewer-count">Сравнение</span>${close}</div><div class="compare">${fig(viewer.a)}${fig(viewer.b)}</div>`;

  });
}

}

function guideListHtml() {
  const checks = guideChecks();
  return GUIDE.map((g) => `<div class="guide-group">${esc(g.group)}</div>${g.items.map((it) => `<div class="gitem ${checks[it.id] ? 'done' : ''}">
    <label class="check"><input type="checkbox" data-ch="guide-check" data-id="${it.id}" ${checks[it.id] ? 'checked' : ''} aria-label="Проверено: ${esc(it.t)}"></label>
    <div class="gitem-main"><div class="gitem-t">${esc(it.t)}</div><div class="gitem-d">${esc(it.d)}</div></div>
    <button class="btn btn-secondary" data-act="guide-run" data-id="${it.id}">Показать</button>
  </div>`).join('')}`).join('');
}
function guideProgress() {
  const checks = guideChecks();
  const total = GUIDE.reduce((n, g) => n + g.items.length, 0);
  const done = GUIDE.reduce((n, g) => n + g.items.filter((it) => checks[it.id]).length, 0);
  return { total, done };
}
function renderGuidePanel() {
  const panel = $('#guide-panel');
  if (!panel || getComputedStyle(panel).display === 'none') return;
  const list = $('.guide-list', panel);
  const top = list ? list.scrollTop : 0;
  const { total, done } = guideProgress();
  panel.innerHTML = `<div class="guide-head"><h2 class="display">Сценарии для проверки</h2><p>Нажмите «Показать», и приложение слева откроет нужный экран. Отмечайте проверенное: отметки сохраняются.</p><div class="guide-progress"><div class="bar"><i style="width:${(done / total) * 100}%"></i></div><span>${done} из ${total}</span></div></div>
    <div class="guide-list">${guideListHtml()}</div>
    <div class="guide-foot">Все клиенты и телефоны выдуманы, цены и марки пигментов условные. Данные хранятся только в этом браузере. Звонки и сообщения не отправляются.</div>`;
  const l2 = $('.guide-list', panel);
  if (l2) l2.scrollTop = top;
}
function screenGuide() {
  const { total, done } = guideProgress();
  return `<div class="screen">
    ${navBar({ title: 'Сценарии', backTo: '/more' })}
    <div class="scroller">
      <p class="note" style="margin:6px 4px 0">Нажмите «Показать», и приложение откроет нужный экран. Отмечено ${done} из ${total}.</p>
      <div class="guide-list" style="padding:0;margin:0 -8px">${guideListHtml()}</div>
    </div>
  </div>`;
}
INPUTS['guide-check'] = (el) => {
  setGuideCheck(el.dataset.id, el.checked);
  renderGuidePanel();
  const row = el.closest('.gitem');
  if (row) row.classList.toggle('done', el.checked);
};
ACTIONS['guide-run'] = (el) => {
  const it = GUIDE.flatMap((g) => g.items).find((x) => x.id === el.dataset.id);
  if (!it) return;
  if (it.id !== 'lock') ensureUnlocked();
  else { closeAllSheets(); }
  it.run();
};

async function init() {
  bindEvents();
  bindIdle();
  await PhotoDB.loadAll();
  S = loadState();
  if (!S) {
    S = buildDemo();
    saveState({ silent: true });
  } else {
    migrate(S);
    reindex();
  }
  applyTheme();
  if (!location.hash) history.replaceState(null, '', '#/clients');
  render();
  showLock();
  setInterval(renderSyncBits, 30000);
  window.addEventListener('resize', () => {
    if ($('#print-root').classList.contains('show')) fitPrint();
    renderGuidePanel();
  });
  window.addEventListener('online', () => markDirty());
  window.addEventListener('offline', () => { sync.status = 'offline'; renderSyncBits(); });
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);
  // Для отладки из консоли
  window.ketsal = { state: () => S, reset: () => { localStorage.removeItem(LS_KEY); location.reload(); } };
}

init();
